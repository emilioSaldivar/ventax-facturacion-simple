# Instancia Segel en app-fac-electr-prd-01 (10.100.0.145).
# Solo estos dos puertos estan publicados; API y bases de datos no son accesibles.
#
# Antes de aplicar:
#   - Reemplazar los ssl_certificate por el certificado de cada host.
#   - Si este nginx corre en la misma VPS (Rocky, SELinux Enforcing):
#       setsebool -P httpd_can_network_connect 1
#     Sin esto, nginx responde 502 aunque los contenedores esten sanos.

upstream segel_fs_frontend { server 10.100.0.145:8092; }
upstream segel_fe_frontend { server 10.100.0.145:8100; }

server {
    listen 80;
    server_name factura.segel.com.py backoffice.segel.com.py feprod-backoffice.segel.com.py;
    return 301 https://$host$request_uri;
}

# App del operador y enlaces publicos de comprobantes
server {
    listen 443 ssl http2;
    server_name factura.segel.com.py;

    ssl_certificate     /ruta/al/certificado.pem;
    ssl_certificate_key /ruta/a/la/clave.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://segel_fs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}

# Backoffice de facturacion simple (uso interno)
server {
    listen 443 ssl http2;
    server_name backoffice.segel.com.py;

    ssl_certificate     /ruta/al/certificado.pem;
    ssl_certificate_key /ruta/a/la/clave.key;

    client_max_body_size 25m;

    location = / {
        return 302 https://$host/backoffice/;
    }

    location / {
        proxy_pass http://segel_fs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}

# Administracion de facturacion electronica (uso interno)
server {
    listen 443 ssl http2;
    server_name feprod-backoffice.segel.com.py;

    ssl_certificate     /ruta/al/certificado.pem;
    ssl_certificate_key /ruta/a/la/clave.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://segel_fe_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }
}
