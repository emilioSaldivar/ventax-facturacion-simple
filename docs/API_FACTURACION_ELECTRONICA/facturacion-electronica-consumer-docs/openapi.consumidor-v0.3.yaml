  # ─────────────────────────────────────────────────────────
  # API CONSUMERS — ADMIN
  # ─────────────────────────────────────────────────────────

  /conciliacion/idempotency:
    post:
      tags: [Conciliacion]
      summary: Conciliar batch de idempotency_keys
      description: |
        Permite al consumidor recuperar el `document_uuid` de transacciones cuya respuesta se perdio.
        No ejecuta refresh SIFEN ni modifica documentos.

        **Permiso requerido**: `IDEMPOTENCY_RECONCILE`.
        **Rango maximo**: 7 dias. **Keys por request**: max 100.

        Resultados posibles por item:
        - `IMPACTED`: existe documento asociado. Incluye `document_uuid`.
        - `NOT_IMPACTED`: no existe documento en el rango consultado.
        - `DUPLICATE_CONFLICT`: multiples documentos para esa clave (requiere soporte).
        - `INVALID_KEY`: el valor no cumple el formato.
      security:
        - ApiConsumerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileIdempotencyRequest"
            example:
              emisor_id: "80136968-1"
              env: "prod"
              from: "2026-06-01T00:00:00-04:00"
              to: "2026-06-07T23:59:59-04:00"
              idempotency_keys:
                - "A1B2C3D4E5"
                - "A1B2C3D4E6"
      responses:
        "200":
          description: Resultado por clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileIdempotencyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /conciliacion/idempotency/cancel-send:
    post:
      tags: [Conciliacion]
      summary: Cancelar envio local por idempotency_key
      description: |
        Cancela el envio local de un documento en estado `QUEUED_BATCH` identificado por `idempotency_key`,
        siempre que no exista evidencia de transmision a SIFEN (`last_sent_at IS NULL`).

        **No dispara evento fiscal SIFEN**. Solo revierte el documento a `DRAFT` localmente.
        Use este endpoint cuando la respuesta original fue incierta y el consumidor necesita
        cancelar antes de que el batch worker envie el documento.

        **Permiso requerido**: `CANCEL_SEND`.

        Resultados posibles:
        - `CANCELLED_LOCAL`: documento revertido a DRAFT.
        - `NOT_IMPACTED`: no existe documento para esa clave.
        - HTTP 409 `INVALID_DOCUMENT_STATUS`: el documento no esta en `QUEUED_BATCH`.
        - HTTP 409 `TRANSMISSION_EVIDENCE_DETECTED`: ya hay evidencia de transmision.
        - HTTP 409 `DUPLICATE_CONFLICT`: multiples documentos (requiere soporte).
      security:
        - ApiConsumerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSendByIdempotencyRequest"
            example:
              emisor_id: "80136968-1"
              env: "prod"
              idempotency_key: "A1B2C3D4E5"
              reason: "Consumidor cancelo la venta antes de confirmar recepcion."
      responses:
        "200":
          description: Resultado de la operacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelSendByIdempotencyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Documento ineligible (estado invalido o evidencia de transmision)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /recibos:
    post:
      tags: [Recibos]
      summary: Crear recibo de dinero (BORRADOR)
      description: |
        Crea un recibo de dinero en estado `BORRADOR`: mutable, sin numero ni firma.
        No tiene validez legal hasta que se llame `POST /recibos/{id}/emitir`.

        Fundamento legal: Ley N.º 6822/2021 (firma electronica cualificada). El recibo
        **nunca se transmite a SIFEN/DNIT** — es una entidad independiente de los DE.
      security:
        - ApiConsumerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReciboDineroInput"
      responses:
        "201":
          description: Recibo creado en estado BORRADOR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboDineroResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validacion de datos o `referencia_documento_uuid` invalido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Recibos]
      summary: Listar recibos del emisor
      description: |
        Soporta `updated_since` para sincronizacion incremental: la app consumidora puede
        reconstruir su cache local consultando solo lo que cambio desde el ultimo `polling`.
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: emisor_id
          in: query
          required: true
          schema:
            type: string
          description: RUC completo del emisor.
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/ReciboEstado"
        - name: updated_since
          in: query
          schema:
            type: string
            format: date-time
        - name: fecha_desde
          in: query
          schema:
            type: string
            format: date
        - name: fecha_hasta
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboDineroListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recibos/{id}:
    get:
      tags: [Recibos]
      summary: Detalle de un recibo (autenticado)
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: id
