              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El recibo ya no esta en estado BORRADOR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Recibos]
      summary: Eliminar (soft delete) un recibo en estado BORRADOR
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Recibo eliminado.
        "404":
          description: Recibo no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El recibo ya no esta en estado BORRADOR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recibos/{id}/emitir:
    post:
      tags: [Recibos]
      summary: Emitir (firmar) un recibo
      description: |
        Punto real de firma: asigna numero correlativo y `verification_token`, genera y firma
        el XML (XMLDSig) y el PDF (PAdES) con el certificado `.p12` vigente del emisor, y
        persiste todo de forma atomica. Si cualquier paso de firma falla, el recibo permanece
        `BORRADOR` (no se consume numeracion).
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recibo EMITIDO, firmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboDineroResult"
        "404":
          description: Recibo no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El recibo ya fue emitido o anulado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Certificado del emisor no encontrado o vencido (`CERTIFICATE_NOT_FOUND` / `CERTIFICATE_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Fallo de firma XML o PDF (`XML_SIGNATURE_FAILED` / `PDF_SIGNATURE_FAILED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recibos/{id}/anular:
    post:
      tags: [Recibos]
      summary: Anular un recibo EMITIDO
      description: |
        Genera un nuevo recibo firmado ("recibo de anulacion") que referencia al original.
        El XML/PDF del recibo original nunca se modifican; solo cambia su `estado`.
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReciboAnularInput"
      responses:
        "200":
          description: Recibo de anulacion, firmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboDineroResult"
        "404":
          description: Recibo no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El recibo esta en BORRADOR o ya fue anulado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /recibos/{id}/pdf:
    get:
      tags: [Recibos]
      summary: Descargar PDF del recibo
      description: |
        Si el recibo esta `BORRADOR`, genera una vista previa no firmada bajo demanda
        (numero mostrado como `-------`, sin QR funcional). Si esta `EMITIDO`/`ANULADO`,
        devuelve el PDF firmado ya persistido (nunca se regenera).
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF del recibo.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Recibo no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recibos/{id}/xml:
    get:
      tags: [Recibos]
      summary: Descargar XML firmado del recibo
      description: Solo disponible si el recibo esta `EMITIDO` (o `ANULADO`).
      security:
        - ApiConsumerKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: XML firmado del recibo.
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Recibo no encontrado o aun en BORRADOR (sin XML firmado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /verificar/recibo/{token}:
    get:
      tags: [Recibos]
      summary: Verificacion publica de autenticidad (sin autenticacion)
      description: |
        Endpoint publico enlazado desde el QR del PDF. Deliberadamente no expone importe,
        receptor ni concepto: solo confirma validez/estado del recibo.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resultado de la verificacion (recibo existente, `EMITIDO` o `ANULADO`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboVerificacionResult"
        "404":
          description: Token inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboVerificacionResult"

  /verificar/recibo/{token}/pdf:
    get:
      tags: [Recibos]
      summary: Descarga publica del PDF firmado (sin autenticacion)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF firmado.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Token inexistente o recibo aun BORRADOR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /verificar/recibo/{token}/xml:
    get:
      tags: [Recibos]
      summary: Descarga publica del documento electronico (XML firmado, sin autenticacion)
      description: |
        El "documento electronico" del recibo: el XML firmado con XMLDSig, fuente de verdad
        legal de la que se deriva el PDF. Mismo criterio de disponibilidad que el PDF publico:
        solo si el recibo esta EMITIDO/ANULADO.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: XML firmado.
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Token inexistente o recibo aun BORRADOR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:
  securitySchemes:
    ApiConsumerKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Clave de consumidor, emitida individualmente por el proveedor del servicio (una por cliente/integracion).
        Formato alternativo: `Authorization: Bearer <api_key>`.
        Requerida para `POST /factura` y `POST /conciliacion/idempotency*`.
        Tiene permisos y alcance de emisor/ambiente propios por consumidor — no puede operar fuera de su alcance asignado.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Clave global compartida (una sola clave para todos los consumidores), provista por el proveedor del servicio junto con la API key de consumidor.
        Formato alternativo: `Authorization: Bearer <api_key>`.
        Requerida hoy para los endpoints de consulta (`/consultar/*`, `/documentos/*`), archivos (`/files/*`) y eventos/nota de credito (`/evento/*`, `/nota-credito`).
        Importante: esta clave no distingue por consumidor ni por emisor — cualquiera que la tenga puede consultar o accionar sobre documentos de cualquier emisor dado de alta en el servicio. Tratarla con el mismo cuidado que un secreto de administrador y no compartirla mas alla de lo necesario.

  responses:
    Unauthorized:
      description: API key ausente, invalida o consumidor inactivo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: UNAUTHORIZED
            message: API key invalida o consumidor inactivo
    Forbidden:
      description: Sin permiso funcional o sin alcance sobre el emisor/env.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: FORBIDDEN
            message: Permiso requerido - FACTURA_EMIT
    ValidationError:
      description: Payload invalido o parametros faltantes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: VALIDATION_ERROR
            message: idempotency_key es requerido


  schemas:
    DocumentStatus:
      type: string
      description: Estado interno del DE
      enum:
        - DRAFT
        - XML_GENERATED
        - XML_SIGNED
        - QR_ATTACHED
        - TRANSMISSION_FAILED
        - QUEUED_SYNC
        - SENT_SYNC
        - QUEUED_BATCH
        - SENT_BATCH
        - APPROVED
        - APPROVED_WITH_OBS
        - REJECTED
        - CANCEL_REQUESTED
        - CANCELLED
        - VOID_REQUESTED
        - VOIDED

    EmitMode:
      type: string
      enum: [SYNC, BATCH, AUTO]

    EmailDeliveryStatus:
      type: string
      description: Estado operativo de entrega de XML/KUDE al receptor. No representa aceptacion SIFEN.
      enum: [NOT_APPLICABLE, PENDING, SENT, FAILED]

    LocalArtifactStatus:
      type: object
      description: Artefactos locales generados antes o independientemente del despacho fiscal.
      properties:
        xml_unsigned:
          type: boolean
          description: Existe XML local sin firma.
        xml_signed:
          type: boolean
          description: Existe XML firmado.
        xml_qr:
          type: boolean
          description: Existe XML firmado con QR AA002.
        kude_pdf:
          type: boolean
          description: Existe KUDE PDF local.
        email_delivery:
          $ref: "#/components/schemas/EmailDeliveryStatus"
        email_sent_before_sifen_approval:
          type: boolean
          nullable: true
          description: Indica si el correo operativo fue enviado cuando el DE aun no estaba aprobado por SIFEN.

    BatchTransmissionInfo:
      type: object
      description: Datos de despacho por lote conforme MT150.
      properties:
        batch_id:
          type: string
          nullable: true
        did:
          type: string
          nullable: true
          description: "`dId` local secuencial por emisor/ambiente usado en `rEnvioLote`."
        dProtConsLote:
          type: string
          nullable: true
          description: Protocolo SIFEN retornado por `siRecepLoteDE`; debe usarse para `consultaLote`.
        dCodRes:
          type: string
          nullable: true
          description: Codigo de recepcion de lote; `0300` indica lote recibido con exito.
        dMsgRes:
          type: string
          nullable: true
          description: Mensaje de recepcion de lote.
        dTpoProces:
          type: string
          nullable: true
          description: Tiempo promedio de procesamiento informado por SIFEN para diferir polling.
        result_code:
          type: string
          nullable: true
          description: Codigo de consulta de lote; por ejemplo `0360`, `0361` o `0362`.
        result_message:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum: [CREATED, RECEIVED, PROCESSING, DONE, ERROR]

    CondicionOperacion:
      type: string
      enum: [CONTADO, CREDITO]

    NumberingInstruction:
      type: object
      description: Metadata opcional para clientes externos que desean delegar la numeracion al servicio.
      properties:
        mode:
          type: string
          enum: [ONLINE]
          default: ONLINE
        authority:
          type: string
          description: Autoridad esperada para determinar el numero fiscal final.
          enum: [SERVICE, CLIENT]
          default: SERVICE
        requested_document_number:
          type: string
          nullable: true
          description: Numero sugerido por el cliente; el servicio puede conservarlo solo como auditoria.

    ExternalClientReference:
      type: object
      description: Metadata opcional del sistema consumidor para trazabilidad e idempotencia.
      properties:
        source_system:
          type: string
          example: external-client
        entity_type:
          type: string
          example: sale
        entity_id:
          type: string
          example: "68"
        request_id:
          type: string
          example: mov-136
        idempotency_key:
          type: string
          example: mov-136
        operational_series:
          type: string
          nullable: true
          example: SERV
          description: Serie comercial/operativa del sistema consumidor. No se copia automaticamente a `dSerieNum`.

    ResolvedEmissionProfile:
      type: object
      nullable: true
      description: Perfil operativo/fiscal resuelto por el servicio para la emision.
      properties:
        code:
          type: string
          example: SERV
        description:
          type: string
          nullable: true
          example: Servicios
        actividadEconomicaCodigo:
          type: string
          example: "82110"
        separation_strategy:
          type: string
          enum: [SHARED_SEQUENCE, FISCAL_SERIES, SEPARATE_EXPEDITION_POINT]
          example: SHARED_SEQUENCE
        serie_operativa:
          type: string
          nullable: true
          example: SERV
        serie_fiscal:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          example: AA
          description: Serie fiscal SIFEN `C010 dSerieNum`, si aplica.

    ResolvedTimbrado:
      type: object
      required: [timbrado, establecimiento, puntoExpedicion, documentoNro, fecIni]
      properties:
        timbrado:
          type: string
        establecimiento:
          type: string
          example: "001"
        puntoExpedicion:
          type: string
          example: "001"
        documentoNro:
          type: string
          example: "0001081"
        fecIni:
          type: string
          format: date

    EmitirFacturaRequest:
      type: object
      required:
        - emisor_id
        - actividadEconomicaCodigo
        - timbrado
        - receptor
        - fecha
        - condicionOperacion
        - items
        - envio
      properties:
        emisor_id:
          type: string
          example: "80136968-1"
          description: RUC completo del emisor configurado en FE (`emisores.ruc_completo`, formato numero-dv). No usar el ID interno numerico de la tabla `emisores`.
        actividadEconomicaCodigo:
          type: string
          example: "82110"
          description: |
            Codigo de actividad economica declarada/configurada para el emisor. Es obligatorio.
            El servicio debe validarlo contra actividades activas del emisor y contra el perfil/boca de emision.
            Este codigo no particiona por si solo la numeracion fiscal ni permite repetir numeros.
        tipoTransaccion:
          type: integer
          enum: [1, 2, 3]
          default: 1
          description: |
            Criterio de clasificacion fiscal para `iTipTra`:
            - `1`: Venta de mercaderia
            - `2`: Prestacion de servicios
            - `3`: Mixto (mercaderia + servicios)
            Si no se envia, FE aplica fallback a `1`.
        emission_profile_code:
          type: string
          nullable: true
          example: SERV
          description: |
            Codigo de perfil de emision configurado en FE. Permite resolver timbrado, punto, serie fiscal,
            numerador y estrategia de separacion. Si se omite, FE solo puede usar un perfil default no ambiguo.
        timbrado:
          type: object
          required: [timbrado, establecimiento, puntoExpedicion, documentoNro, fecIni]
          properties:
            timbrado:
              type: string
            establecimiento:
              type: string
              example: "001"
            puntoExpedicion:
              type: string
              example: "001"
            documentoNro:
              type: string
              example: "0000001"
              description: |
                Numero sugerido o referencial provisto por el cliente. En contratos con numeracion delegada,
                el servicio puede usarlo solo como referencia y asignar el numero fiscal oficial desde su propio numerador.
            fecIni:
              type: string
              format: date
        numbering:
          $ref: "#/components/schemas/NumberingInstruction"
        client_reference:
          $ref: "#/components/schemas/ExternalClientReference"
        receptor:
          type: object
          required: [docNro, razonSocial]
          properties:
            tipoDocumento:
              type: string
              description: Tipo de documento del receptor. Si se omite, se asume `CI`.
              enum: [CI, RUC, PASAPORTE, CEDULA_EXTRANJERA, CARNET_RESIDENCIA, INNOMINADO, TARJETA_DIPLOMATICA, NO_ESPECIFICADO]
              default: CI
            docNro:
              type: string
              description: Número de documento. Para `RUC` puede enviarse solo la base y complementar con `dv`, o el valor completo `base-dv`.
            dv:
              type: string
              nullable: true
              description: Dígito verificador del RUC. Usado cuando `tipoDocumento=RUC` y `docNro` no incluye guion.
            razonSocial:
              type: string
            direccion:
              type: string
              nullable: true
            telefono:
              type: string
              nullable: true
              description: |
                Telefono del receptor normalizado por FE a solo digitos.
                Se eliminan espacios y caracteres especiales.
                Si el valor normalizado supera 15 digitos, FE rechaza con `422`.
            email:
              type: string
              format: email
              nullable: true
              description: Email del cliente final. Si existe, el backend fiscal intenta enviar XML y KUDE PDF.
        fecha:
          type: string
          format: date-time
        condicionOperacion:
          type: object
          required: [tipo]
          properties:
            tipo:
              $ref: "#/components/schemas/CondicionOperacion"
            pagos:
              type: array
              description: Solo para CONTADO. Para CREDITO debe ir vacío o ausente.
              items:
                type: object
                required: [medio, monto]
                properties:
                  medio:
                    type: string
                    description: "Ej: EFECTIVO, TARJETA, TRANSFERENCIA, etc."
                  monto:
                    type: number
                    format: double
            credito:
              $ref: "#/components/schemas/CreditoOperacion"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [codigo, descripcion, cantidad, precioUnitario, ivaTipo]
            properties:
              codigo:
                type: string
              descripcion:
                type: string
              cantidad:
                type: number
                format: double
              precioUnitario:
                type: number
                format: double
                description: Precio unitario IVA incluido (según tu modelo actual)
              ivaTipo:
                type: string
                enum: [IVA10, IVA5, EXENTO]
                description: |
                  Tipo de IVA del item segun MT v150.
                  - IVA10: gravado tasa 10%
                  - IVA5: gravado tasa 5%
                  - EXENTO: exento de IVA
        envio:
          type: object
          required: [mode]
          properties:
            mode:
              $ref: "#/components/schemas/EmitMode"
            sendNow:
              type: boolean
              default: true

    EmitirFacturaResponse:
      type: object
      required: [document_id, cdc, nro_factura, status]
      properties:
        document_id:
          type: string
        cdc:
          type: string
        nro_factura:
          type: string
          example: "001-001-0000001"
        timbrado:
          $ref: "#/components/schemas/ResolvedTimbrado"
        status:
          $ref: "#/components/schemas/DocumentStatus"
        delivery_mode:
          type: string
          nullable: true
          enum: [SYNC, BATCH, AUTO_FALLBACK_BATCH]
        email_status:
          $ref: "#/components/schemas/EmailDeliveryStatus"
          nullable: true
          description: Resultado operativo del envio de XML y KUDE PDF al cliente final; no implica aceptacion SIFEN.
        local_artifacts:
          $ref: "#/components/schemas/LocalArtifactStatus"
        batch:
          $ref: "#/components/schemas/BatchTransmissionInfo"
        number_source:
          type: string
          nullable: true
          description: Autoridad que determino el numero fiscal final del documento.
          enum: [SERVICE, CLIENT]
        emission_profile:
          $ref: "#/components/schemas/ResolvedEmissionProfile"
        xml_qr:
          type: string
          nullable: true
          description: XML final (firmado + QR AA002). Se puede omitir en prod si se usa storage externo.
        sifen:
          type: object
          nullable: true
          description: Resumen de respuesta de SIFEN si mode=SYNC
          additionalProperties: true

    CreditoOperacion:
      oneOf:
        - type: object
          required: [modalidad, plazoDias]
          properties:
            modalidad:
              type: string
              enum: [PLAZO]
            plazoDias:
              type: integer
              minimum: 1
              example: 30
        - type: object
          required: [modalidad, cantidadCuotas]
          properties:
            modalidad:
              type: string
              enum: [CUOTAS]
            cantidadCuotas:
              type: integer
              minimum: 1
              example: 2
            cuotas:
              type: array
              description: Detalle opcional para trazabilidad local y soporte de xmlgen si aplica.
              items:
                type: object
                required: [monto, vencimiento]
                properties:
                  monto:
                    type: number
                    format: double
                  vencimiento:
                    type: string
                    format: date
                  moneda:
                    type: string
                    default: PYG

    NotaCreditoReferencia:
      oneOf:
        - type: object
          required: [tipo, cdc]
          properties:
            tipo:
              type: string
              enum: [ELECTRONICO]
            cdc:
              type: string
              description: CDC de la Factura Electronica referenciada.
        - type: object
          required: [tipo, timbrado, establecimiento, puntoExpedicion, numero]
          properties:
            tipo:
              type: string
              enum: [IMPRESO]
            timbrado:
              type: string
            establecimiento:
              type: string
              example: "001"
            puntoExpedicion:
              type: string
              example: "001"
            numero:
              type: string
              example: "0000001"
            fecha:
              type: string
              format: date
              nullable: true

    EmitirNotaCreditoRequest:
      type: object
      required:
        - emisor_id
        - timbrado
        - receptor
        - fecha
        - motivo
        - referencia
        - items
        - envio
      properties:
        emisor_id:
          type: string
          example: "80136968-1"
          description: RUC completo del emisor configurado en FE (`emisores.ruc_completo`, formato numero-dv). No usar el ID interno numerico de la tabla `emisores`.
        timbrado:
          type: object
          required: [timbrado, establecimiento, puntoExpedicion, documentoNro, fecIni]
          properties:
            timbrado:
              type: string
            establecimiento:
              type: string
              example: "001"
            puntoExpedicion:
              type: string
              example: "001"
            documentoNro:
              type: string
              example: "0000001"
            fecIni:
              type: string
              format: date
        receptor:
          type: object
          required: [docNro, razonSocial]
          properties:
            tipoDocumento:
              type: string
              enum: [CI, RUC, PASAPORTE, CEDULA_EXTRANJERA, CARNET_RESIDENCIA, INNOMINADO, TARJETA_DIPLOMATICA, NO_ESPECIFICADO]
              default: CI
            docNro:
              type: string
              description: |
                Numero de documento del receptor. Para `tipoDocumento=CI` debe ser numerico.
                Para `tipoDocumento=RUC` debe informarse como `base-dv` o con `dv` separado.
                Valores genericos como `S/D` no son validos para NCE.
            dv:
              type: string
              nullable: true
            razonSocial:
              type: string
            direccion:
              type: string
              nullable: true
            telefono:
              type: string
              nullable: true
        fecha:
          type: string
          format: date-time
        motivo:
          type: object
          required: [codigo]
          properties:
            codigo:
              type: integer
              minimum: 1
              description: Codigo de motivo de emision de la NCE segun catalogo SIFEN.
        referencia:
          $ref: "#/components/schemas/NotaCreditoReferencia"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [codigo, descripcion, cantidad, precioUnitario, ivaTipo]
            properties:
              codigo:
                type: string
              descripcion:
                type: string
              cantidad:
                type: number
                format: double
              precioUnitario:
                type: number
                format: double
              ivaTipo:
                type: string
                enum: [IVA10, IVA5, EXENTO]
                description: |
                  Tipo de IVA del item segun MT v150.
                  - IVA10: gravado tasa 10%
                  - IVA5: gravado tasa 5%
                  - EXENTO: exento de IVA
        envio:
          type: object
          required: [mode]
          properties:
            mode:
              $ref: "#/components/schemas/EmitMode"
            sendNow:
              type: boolean
              default: true

    EmitirNotaCreditoResponse:
      type: object
      required: [document_id, status, idempotent]
      properties:
        document_id:
          type: string
        cdc:
          type: string
          nullable: true
        nro_documento:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/DocumentStatus"
        idempotent:
          type: boolean
        delivery_mode:
          type: string
          nullable: true
          enum: [SYNC, BATCH, AUTO_FALLBACK_BATCH]
        sifen:
          type: object
          nullable: true
          additionalProperties: true

    CancelarRequest:
      type: object
      required: [emisor_id, cdc, motivo]
      properties:
        emisor_id:
          type: string
          example: "80136968-1"
          description: RUC completo del emisor configurado en FE (`emisores.ruc_completo`, formato numero-dv). No usar el ID interno numerico de la tabla `emisores`.
        cdc:
          type: string
        motivo:
          type: string
          maxLength: 150

    InutilizarRequest:
      type: object
      required: [emisor_id, establecimiento, puntoExpedicion, desdeNumero, hastaNumero, motivo]
      properties:
        emisor_id:
          type: string
          example: "80136968-1"
          description: RUC completo del emisor configurado en FE (`emisores.ruc_completo`, formato numero-dv). No usar el ID interno numerico de la tabla `emisores`.
        establecimiento:
          type: string
          example: "001"
        puntoExpedicion:
          type: string
          example: "001"
        desdeNumero:
