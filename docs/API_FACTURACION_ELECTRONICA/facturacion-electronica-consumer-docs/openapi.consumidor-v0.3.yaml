openapi: 3.0.3
info:
  title: Facturación Electrónica SIFEN - MVP v0.1
  version: 0.1.0
  description: |
    Servicio Node.js para SIFEN (Paraguay) conforme Manual Técnico v150.
    MVP: Emisión FE (CONTADO/CREDITO), firma, QR, envío SYNC/Lote, eventos (cancelación/inutilización), consultas/listado.

servers:
  - url: /v1

tags:
  - name: System
  - name: Emision
  - name: Conciliacion
    description: Conciliacion y cancelacion local por idempotency_key. Requiere API key de consumidor.
  - name: Eventos
  - name: Consultas
  - name: Archivos
  - name: Contrato Canónico
    description: Endpoints por document_uuid (identidad estable). Recomendado para integraciones nuevas.
  - name: Recibos
    description: |
      Recibo de dinero firmado digitalmente (Ley N.º 6822/2021). No es un DE de SIFEN,
      nunca se transmite a DNIT. Ciclo BORRADOR -> EMITIDO (firma XMLDSig + PAdES) -> ANULADO.
      Usa exclusivamente ApiConsumerKeyAuth (sin clave compartida) salvo los endpoints
      publicos de verificacion, que no requieren autenticacion.

security:
  - ApiConsumerKeyAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Healthcheck
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: facturacion-electronica
                  db:
                    type: boolean
                    example: true

  /factura:
    post:
      tags: [Emision]
      summary: Emitir Factura Electrónica (CONTADO o CREDITO)
      description: |
        Crea/obtiene un DE idempotente, genera XML v150, firma, inserta QR (AA002).

        **Autenticacion**: requiere API key de consumidor (`X-Api-Key`). La API key global queda retirada de este endpoint.

        **Idempotencia**: `client_reference.idempotency_key` es **obligatorio**. Formato: `^[A-Za-z0-9_-]{8,80}$`.
        La unicidad es compuesta: `consumer_id + emisor_id + env + idempotency_key`.
        Si el consumidor reintenta con la misma clave, el sistema devuelve el documento existente con `idempotent: true` (HTTP 200) sin consumir nueva numeracion.

        **Modos de envio**:
        - `SYNC`: envio inmediato a SIFEN. Responde con estado fiscal final.
        - `BATCH`: encola para envio por lote. HTTP 200 con `status: QUEUED_BATCH`.
        - `AUTO`: intenta SYNC y ante falla tecnica o rechazo SIFEN 1264, cae a BATCH (HTTP 202).
      security:
        - ApiConsumerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitirFacturaRequest"
      responses:
        "200":
          description: |
            Emitida/encolada correctamente (nueva emision), o retry idempotente recuperado.
            Cuando `idempotent: true`, el documento ya existia y no se consumio nueva numeracion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitirFacturaResponse"
        "202":
          description: Documento aceptado localmente y encolado por fallback AUTO tecnico o rechazo SIFEN 1264.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitirFacturaResponse"
        "401":
          description: API key ausente, invalida o consumidor inactivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Consumidor sin permiso FACTURA_EMIT o sin alcance sobre el emisor/env solicitado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validacion de datos (incluye idempotency_key faltante o con formato invalido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nota-credito:
    post:
      tags: [Emision]
      security:
        - ApiKeyAuth: []
      summary: Emitir Nota de Crédito Electrónica
      description: |
        Crea/obtiene una NCE idempotente, genera XML v150 con `C002=5`, firma, inserta QR (AA002)
        y transmite segun `envio.mode`.

        Para referencia electronica, el CDC asociado debe existir localmente y corresponder a una FE.
        Para referencia impresa, se informan los datos del documento impreso tipo factura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitirNotaCreditoRequest"
      responses:
        "200":
          description: NCE emitida o encolada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitirNotaCreditoResponse"
        "202":
          description: NCE aceptada localmente y encolada por fallback AUTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitirNotaCreditoResponse"
        "409":
          description: Documento ya existe o monto acumulado de NCE excede la FE asociada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Factura electronica referenciada no encontrada localmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validacion de datos o referencia documental invalida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evento/cancelar:
    post:
      tags: [Eventos]
      security:
        - ApiKeyAuth: []
      summary: Cancelar un DE (Factura) por CDC
      description: |
        Reglas MVP:
        - Solo si el DE está aprobado (APPROVED / APPROVED_WITH_OBS).
        - Validar ventana operativa de cancelación (48h desde aprobación en SIFEN para FE).
        Envía evento a SIFEN y persiste resultado.
        En backoffice, esta acción debe diferenciarse de `cancel-send`, que solo retira un documento de la cola batch antes de transmitirlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelarRequest"
      responses:
        "200":
          description: Evento procesado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoResponse"
        "404":
          description: Documento no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Estado no permite cancelación / fuera de ventana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validación de datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evento/inutilizacionnumfactura:
    post:
      tags: [Eventos]
      security:
        - ApiKeyAuth: []
      summary: Inutilizar rango de numeración FE
      description: |
        Inutiliza un rango secuencial de numeración (hasta 1000).
        Reglas MVP:
        - motivo requerido (<=150 chars)
        - rango secuencial válido
        - no permitir inutilizar números ya utilizados por DE aprobados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InutilizarRequest"
      responses:
        "200":
          description: Evento procesado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoResponse"
        "409":
          description: Rango inválido / contiene utilizados / conflicto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validación de datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultar/comprobante/{cdc}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Consultar comprobante por CDC (estado interno)
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento cuando la base aloja mas de un ambiente.
      responses:
        "200":
          description: Comprobante encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteResponse"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultar/comprobantexml/{cdc}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Obtener XML por CDC (unsigned/signed/qr)
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento cuando la base aloja mas de un ambiente.
      responses:
        "200":
          description: XMLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteXmlResponse"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultar/comprobanteSifen/{cdc}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Consultar estado en SIFEN por CDC
      description: |
        Si refresh=true, consulta en SIFEN y actualiza cache.
        Si refresh=false, devuelve el cache persistido.
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento y destino de la consulta remota a SIFEN.
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Estado SIFEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SifenStatusResponse"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultar/{id}/facturalista/{numero}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Listar facturas (compatibilidad DocuJSON)
      description: |
        Mantiene el path esperado: /consultar/{id}/facturalista/{numero}
        Interpretación MVP:
        - {id} = emisor_id o tenant_id (definir en implementación, por defecto emisor_id)
        - {numero} = cursor/offset (int)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: numero
          required: true
          schema:
            type: integer
        - in: query
          name: env
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento cuando la base aloja mas de un ambiente.
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaFacturasResponse"

  /consultar/evento/{cdc}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Consultar eventos por CDC
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del evento cuando la base aloja mas de un ambiente.
      responses:
        "200":
          description: Eventos asociados al CDC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventosResponse"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultar/{id}/batch-pendientes:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Consultar cola y lotes pendientes por emisor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: env
          schema:
            type: string
            enum: [test, prod]
        - in: query
          name: tipoDocumento
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Cola y lotes pendientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPendientesResponse"

  # ─── Batch Consulta MT150 — T002/T003 ────────────────────────────────────

  /consultar/{id}/lotes:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Listar lotes de un facturador por rango de fechas
      description: |
        Listado paginado de lotes SIFEN de un facturador con filtros operativos.
        No confundir `did` (identificador interno del sistema) con `sifen_protocol`
        (`dProtConsLote` de SIFEN), que es el identificador de consulta real.
      parameters:
        - name: id
          in: path
          required: true
          description: RUC completo del facturador (emisor_id)
          schema:
            type: string
        - name: env
          in: query
          schema:
            type: string
            enum: [test, prod]
        - name: from
          in: query
          description: Inicio del rango temporal (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fin del rango temporal (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [CREATED, SENT, RECEIVED, PROCESSING, DONE, ERROR]
        - name: tipoDocumento
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista de lotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchListResponse"
        "401":
          description: API key inválida
        "422":
          description: Parámetros de query inválidos

  /consultar/{id}/lotes/{protocol}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Consulta puntual de lote por protocolo SIFEN (dProtConsLote)
      description: |
        Consulta un lote identificado por su `dProtConsLote` (protocolo SIFEN real).
        Con `refresh=true`, ejecuta `setapi.consultaLote` con el protocolo real y persiste
        el resultado usando el mismo parser MT150 del worker de polling.
        **Throttling**: refresh omitido para lotes ya concluyentes (DONE/ERROR).
      parameters:
        - name: id
          in: path
          required: true
          description: RUC completo del facturador (emisor_id)
          schema:
            type: string
        - name: protocol
          in: path
          required: true
          description: Protocolo SIFEN del lote (dProtConsLote retornado en recepción)
          schema:
            type: string
        - name: env
          in: query
          schema:
            type: string
            enum: [test, prod]
        - name: refresh
          in: query
          description: |
            Si true, consulta SIFEN en tiempo real y persiste resultado.
            Omitido automáticamente para lotes DONE/ERROR.
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "200":
          description: Detalle del lote con estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchByProtocolResponse"
        "401":
          description: API key inválida
        "404":
          description: Protocolo no encontrado para el facturador
        "422":
          description: Parámetros inválidos

  /consultar/ruc/{ruc}:
    get:
      tags: [Consultas]
      security:
        - ApiKeyAuth: []
      summary: Consultar RUC en SIFEN y devolver datos normalizados
      parameters:
        - in: path
          name: ruc
          required: true
          schema:
            type: string
          description: RUC base (5-8 dígitos) o formato numero-dv.
        - in: query
          name: emisor_id
          required: true
          schema:
            type: string
          description: RUC completo del emisor configurado en FE (se usa para resolver credenciales).
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
      responses:
        "200":
          description: Resultado normalizado de consulta RUC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultaRucNormalizedResponse"
        "422":
          description: Validación de parámetros o datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /files/xml/{cdc}:
    get:
      tags: [Archivos]
      security:
        - ApiKeyAuth: []
      summary: Descargar XML final por CDC
      description: |
        Descarga el XML local del Documento Electronico.
        Usa `xml_qr` como fuente primaria y `xml_signed` como fallback.
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento cuando la base aloja mas de un ambiente.
      responses:
        "200":
          description: XML descargable
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment con nombre `<cdc>.xml`.
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: No existe XML local asociado al CDC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: xml_not_found
        "500":
          description: Fallo al descargar XML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                generationFailed:
                  value:
                    error: xml_download_failed

  /files/kude/{cdc}.pdf:
    get:
      tags: [Archivos]
      security:
        - ApiKeyAuth: []
      summary: Descargar PDF KUDE por CDC
      description: |
        Genera y descarga un PDF KUDE desde el XML local del Documento Electronico.
        Usa `facturacionelectronicapy-kude` y requiere Java disponible en runtime.
        En instancias multi-facturador, usa el logo configurado en el emisor propietario del documento
        (`emisores.logo_path`). Si el emisor no tiene logo configurado, el KUDE se genera sin imagen de logo.
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento cuando la base aloja mas de un ambiente.
      responses:
        "200":
          description: PDF KUDE descargable
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment con nombre `<cdc>.pdf`.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: No existe XML local asociado al CDC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: kude_xml_not_found
        "500":
          description: Fallo al generar KUDE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                generationFailed:
                  value:
                    error: kude_generation_failed

  /files/ticket/{cdc}/raw:
    get:
      tags: [Archivos]
      security:
        - ApiKeyAuth: []
      summary: Obtener ticket térmico crudo por CDC
      description: |
        Genera una salida de ticket térmico a partir del XML local del Documento Electrónico.

        Modos soportados:
        - sin `format`: devuelve ticket en `text/plain`
        - con `format=escpos`: devuelve payload binario `ESC/POS` listo para impresora térmica
      parameters:
        - in: path
          name: cdc
          required: true
          schema:
            type: string
        - in: query
          name: env
          required: false
          schema:
            type: string
            enum: [test, prod]
          description: Ambiente persistido del documento cuando la base aloja mas de un ambiente.
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [escpos]
          description: Si vale `escpos`, retorna `application/octet-stream`. Si se omite, retorna `text/plain`.
      responses:
        "200":
          description: Ticket generado correctamente
          content:
            text/plain:
              schema:
                type: string
              examples:
                rawTicket:
                  summary: Ticket texto plano
                  value: |
                    80136968-1
                    AWAPURA E.A.S. UNIPERSONAL
                    3 de febrero
                    VILLA ELISA
                    Tel: 0981296077
                    ------------------------------------------------
                    Timbrado:         80136968
                    Documento:        Factura electronica
                    Numero:           001-001-0000953
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No existe XML local asociado al CDC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: raw_ticket_not_found
                    message: Ticket crudo no encontrado
        "500":
          description: Fallo al transformar el XML a ticket térmico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                generationFailed:
                  value:
                    error: raw_ticket_generation_failed
                    message: No se pudo generar el ticket crudo

# ─────────────────────────────────────────────────────────────
# Contrato Canónico — TCC022/TCC023/TCC024/TCC025/TCC026/TCC027
# Identidad principal: document_uuid (estable e inmutable)
# Reemplaza los endpoints legacy centrados en CDC.
# Ver docs/GUIA_MIGRACION_CONTRATO_CANONICO_v0.1.md para tabla de homologación.
# ─────────────────────────────────────────────────────────────

  /documentos/by-cdc/{cdc}:
    get:
      summary: Resolver CDC a documento canónico (TCC023)
      description: |
        Resuelve un CDC vigente o histórico al documento canónico correspondiente.
        Indica si el CDC consultado es el vigente (`is_current=true`) o fue reemplazado.

        **Uso operativo:** usar este endpoint cuando el sistema cliente almacenó un CDC
        y necesita obtener el `document_uuid` canónico para migrar sus referencias.
        No usar este endpoint como identidad primaria — usar `/documentos/{uuid}` en su lugar.

        **Homólogo legacy:** `GET /consultar/comprobante/{cdc}`
      tags: [Contrato Canónico]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: cdc
          in: path
          required: true
