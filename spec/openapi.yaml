                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout al cancelar en backend fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/{documentoId}/inutilizar:
    post:
      tags: [Facturas]
      summary: Inutilizar el numero de una factura rechazada (operador)
      description: |
        SPEC_CORRECCION_INUTILIZACION_RECHAZADAS_v0.1, fase B. Solo una `FACTURA` en `RECHAZADA` con CDC
        y numero fiscal, sin inutilizacion aceptada (`puede_inutilizar = true`). El servidor arma el
        pedido a `facturacion-electronica` (`POST /v1/evento/inutilizacionnumfactura`) con el emisor
        del facturador y el establecimiento, punto y numero leidos del CDC; del cuerpo solo toma
        `motivo` e ignora cualquier otro campo. No cambia `estado`: el resultado queda en
        `inutilizacion`. No se puede deshacer.

        - SIFEN acepta, o FE responde que el numero ya estaba inutilizado: `inutilizacion.status = ACCEPTED`.
        - SIFEN rechaza el evento: `200` con `inutilizacion.status = REJECTED` y su codigo; se puede reintentar.
        - FE no responde: queda `FAILED` y responde `502` o `504`.
        - FE no admite el pedido (`EVENT_IN_PROGRESS`, `RANGE_ALREADY_USED`, `RANGE_POSSIBLY_CONSUMED`):
          `409` con `details.fe_error`; la factura no cambia.
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 5, maxLength: 150 }
      responses:
        "200":
          description: Intento registrado (aceptado o rechazado por SIFEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Documento no encontrado en el facturador del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `details.reason`: `INUTILIZACION_NO_ADMITIDA`, `NUMERACION_NO_IDENTIFICADA` o
            `INUTILIZACION_RECHAZADA_POR_FE` (con `fe_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: El backend fiscal no respondio; el intento queda `FAILED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /facturas/{documentoId}/nota-credito:
    post:
      tags: [NotasCredito]
      summary: Emitir Nota de Credito Electronica desde factura elegible
      description: |
        Sin `lineas`, emite la NCE total (como en el MVP); con `lineas`, una NCE parcial por esas lineas y
        cantidades, con el precio y el IVA de la factura (SPEC_NOTA_CREDITO_PARCIAL_v0.1). Solo acepta
        facturas `EMITIDA` con CDC. La total exige que la factura no tenga ninguna nota viva; las parciales
        se suman hasta cubrir la factura (saldo por linea, RN-06). Una nota `RECHAZADA` no cuenta.
        En moneda extranjera la total va por referencia y la parcial con `moneda` y `tipoCambio` de la
        factura, ambas solo con `FE_NC_MONEDA_EXTRANJERA`. El envio fiscal usa `envio.mode=BATCH`
        y puede quedar `PENDIENTE_SIFEN` mientras SIFEN procesa el lote.

        La clave de idempotencia hacia FE la deriva el servidor a partir de la factura
        y el numero de intento: el encabezado `Idempotency-Key` se acepta y se ignora (RN-01).

        Si FE responde `502`/`504` (`TRANSMISSION_FAILED`) o `500` (`ISSUE_NCE_FAILED`), o un
        `409 idempotent` con `DRAFT`/`TRANSMISSION_FAILED`, la nota se guarda igual como
        "sin confirmar" (`PENDIENTE_SIFEN`, `accion = REQUIERE_ACCION`,
        `acciones_sugeridas = [REINTENTAR_NOTA_CREDITO]`) y responde `201` (RN-03, RN-04).
        Si la factura ya tiene una nota sin confirmar, este pedido la reintenta con la misma
        clave y responde `200` (RN-02).
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotaCreditoEmitRequest"
      responses:
        "200":
          description: La factura tenia una nota sin confirmar; se reintento con la misma clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoResponse"
        "201":
          description: NCE emitida, en proceso o guardada sin confirmar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          description: >-
            `lineas` no validas: linea inexistente o repetida, cantidad con mas de 4 decimales o mayor que el
            saldo. `details.lineas[]` trae `line_no`, `motivo` y, si corresponde, `saldo`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Factura no elegible (`details.reason`: `NOTA_CREDITO_YA_EMITIDA` si se pide la total con una nota
            viva, `NOTA_CREDITO_SOLO_TOTAL`, `NOTA_CREDITO_TRABADA`, `NOTA_CREDITO_MONEDA_EXTRANJERA`,
            `NOTA_CREDITO_CON_ANTICIPO`), o FE responde `CREDIT_NOTE_TOTAL_EXCEEDED` o
            `INVALID_REFERENCED_DOCUMENT` (`details.fe_code`; FE no numero)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: >-
            FE rechazo el pedido con un error que no crea la nota (400, 401, 404, 409 no idempotente,
            422, 429). Los errores que pudieron crearla se guardan y responden 201
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /facturas/{documentoId}/nota-credito/saldo:
    get:
      tags: [NotasCredito]
      summary: Saldo acreditable por linea de una factura
      description: >-
        SPEC_NOTA_CREDITO_PARCIAL_v0.1. Cantidad facturada, acreditada por notas vivas y saldo de cada linea, y si
        la factura admite nota total o parcial.
      parameters:
