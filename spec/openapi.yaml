      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          maxLength: 300
          description: Motivo operativo de la NCE.
        lineas:
          type: array
          minItems: 1
          maxItems: 200
          description: >-
            SPEC_NOTA_CREDITO_PARCIAL_v0.1. Lineas de la factura a acreditar. Sin este campo, la nota es total y
            copia todas las lineas.
          items:
            type: object
            required: [line_no, cantidad]
            properties:
              line_no:
                type: integer
                minimum: 1
              cantidad:
                type: number
                exclusiveMinimum: 0
                multipleOf: 0.0001
                description: Hasta 4 decimales, no mayor que el saldo de la linea.

    NotaCreditoSaldoResponse:
      type: object
      required: [moneda, admite_total, admite_parcial, motivo_no_parcial, lineas]
      properties:
        moneda:
          type: string
        admite_total:
          type: boolean
          description: Sin notas vivas.
        admite_parcial:
          type: boolean
        motivo_no_parcial:
          type: string
          nullable: true
        lineas:
          type: array
          items:
            type: object
            properties:
              line_no: { type: integer }
              descripcion: { type: string }
              codigo: { type: string, nullable: true }
              precio_unitario: { type: number }
              iva_tipo: { $ref: "#/components/schemas/IvaTipo" }
              cantidad_facturada: { type: number }
              cantidad_acreditada: { type: number }
              saldo: { type: number }

    CancelacionRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          maxLength: 150

    DeliverySummary:
      type: object
      properties:
        public_url:
          type: string
          nullable: true
        whatsapp_url:
          type: string
          nullable: true
        email_status:
          $ref: "#/components/schemas/EmailStatus"
        artifacts:
          $ref: "#/components/schemas/ArtifactsResponse"

    DeliveryLinkResponse:
      type: object
      required: [public_url, token_status]
      properties:
        public_url:
          type: string
          format: uri
        whatsapp_url:
          type: string
          format: uri
        token_status:
          type: string
          enum: [ACTIVE, REVOKED]

    ArtifactsResponse:
      type: object
      required: [kude_pdf, xml]
      properties:
        kude_pdf:
          $ref: "#/components/schemas/ArtifactLink"
        xml:
          $ref: "#/components/schemas/ArtifactLink"

    ArtifactLink:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: true cuando el SaaS tiene CDC para construir la URL del artefacto; no implica aprobacion SIFEN.
        url:
          type: string
          format: uri
          nullable: true

    EmailStatus:
      type: string
      enum: [NOT_APPLICABLE, DELEGATED, PENDING, SENT, FAILED, UNKNOWN]

    EmailStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/EmailStatus"
        message:
          type: string
          nullable: true

    PublicDocumentResponse:
      type: object
      required: [facturador, numero_fiscal, estado, cliente, totals, email_status, artifacts]
      properties:
        facturador:
          $ref: "#/components/schemas/FacturadorSummary"
        numero_fiscal:
          type: string
          nullable: true
        cdc:
          type: string
          nullable: true
        estado:
          $ref: "#/components/schemas/DocumentoEstado"
        cliente:
          $ref: "#/components/schemas/FacturaClienteInput"
        totals:
          $ref: "#/components/schemas/DocumentoTotals"
        email_status:
          $ref: "#/components/schemas/EmailStatus"
        artifacts:
          $ref: "#/components/schemas/ArtifactsResponse"

    FacturadorImportArchivo:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
          maxLength: 255
        format:
          type: string
          enum: [json, yaml, auto]
          default: auto
        content:
          type: string
          maxLength: 512000
          description: Texto crudo del archivo exportado por facturacion-electronica.

    FacturadorImportTarget:
      oneOf:
        - type: object
          required: [mode, tenant_id]
          properties:
            mode:
              type: string
              enum: [EXISTENTE]
            tenant_id:
              type: string
              format: uuid
        - type: object
          required: [mode, nombre, slug, plan_codigo]
          properties:
            mode:
              type: string
              enum: [NUEVO]
            nombre:
              type: string
            slug:
              type: string
            plan_codigo:
              type: string
      discriminator:
        propertyName: mode

    FacturadorImportPreviewRequest:
      allOf:
        - $ref: "#/components/schemas/FacturadorImportArchivo"
        - type: object
          required: [target]
          properties:
            target:
              $ref: "#/components/schemas/FacturadorImportTarget"

    FacturadorImportApplyRequest:
      allOf:
        - $ref: "#/components/schemas/FacturadorImportPreviewRequest"
        - type: object
          required: [preview_token]
          properties:
            preview_token:
              type: string
              pattern: "^[0-9a-f]{64}$"
            permitir_ambiente_distinto:
              type: boolean
              default: false
              description: Override explicito del bloqueante AMBIENTE_DISTINTO. Queda auditado.
            documento_nro_overrides:
              type: object
              additionalProperties:
                type: string
                pattern: "^[0-9]{7}$"
              description: |
                Numero inicial por `ref` de contexto (igual al codigo de perfil para los perfiles de
                FE; `NO_REQUERIDO@<est>-<punto>` para los derivados). Solo se aplica a contextos NUEVOS: sobre uno
                existente se ignora con la advertencia OVERRIDE_IGNORADO, porque la numeracion viva
                nunca se pisa.
            actividad_overrides:
              type: object
              additionalProperties:
                type: string
              description: |
                Actividad economica elegida por `ref` de contexto. Solo se aplica a contextos NUEVOS
                de perfiles que no fijan actividad, y unicamente si el codigo esta entre las
                `actividad_opciones` de ese contexto. En cualquier otro caso se ignora con la
                advertencia OVERRIDE_IGNORADO.
            textos_overrides:
              type: object
              description: |
                Textos visibles de las entidades que se CREAN (SPEC v0.3 RN-32). Sobre una entidad
                existente, o una que el archivo no define, se ignoran con OVERRIDE_IGNORADO.
              properties:
                nombre_fantasia: { type: string, minLength: 1, maxLength: 300 }
                establecimientos:
                  type: object
                  description: Por codigo de establecimiento.
                  additionalProperties: { type: string, minLength: 1, maxLength: 200 }
                puntos:
                  type: object
                  description: Por `<establecimiento>-<punto>`.
                  additionalProperties: { type: string, minLength: 1, maxLength: 200 }
                contextos:
                  type: object
                  description: Alias operativo por `ref` de contexto.
                  additionalProperties: { type: string, minLength: 1, maxLength: 100 }
            adoptar_textos_archivo:
              type: boolean
              default: false
              description: |
                RN-34. Con `true`, los textos visibles existentes se reemplazan por los del archivo.
                Con `false` se conservan y la vista previa los informa con TEXTO_VISIBLE_DIFIERE.
            api_key:
              type: string
              format: password
              writeOnly: true
              minLength: 10
              maxLength: 200
              description: |
                API key del consumidor FE. Obligatoria si el facturador se crea o no tiene clave
                (RN-33); si ya tiene, la reemplaza. Nunca se devuelve.

    ImportHallazgo:
      type: object
      required: [nivel, codigo, mensaje]
      properties:
        nivel:
          type: string
          enum: [BLOQUEANTE, ADVERTENCIA, IGNORADO]
        codigo:
          type: string
        mensaje:
          type: string
        ruta:
          type: string
        valor: {}
        sugerencia:
          type: string

    ImportFieldDiff:
      type: object
      properties:
        campo:
          type: string
        actual: {}
        nuevo: {}

    ImportEntityDiff:
      type: object
      properties:
        codigo:
          type: string
        accion:
          type: string
          enum: [CREAR, ACTUALIZAR, SIN_CAMBIOS, USAR_EXISTENTE]
        id:
          type: string
          format: uuid
          nullable: true
        campos:
          type: array
          items:
            $ref: "#/components/schemas/ImportFieldDiff"
        texto:
          $ref: "#/components/schemas/ImportTextoVisible"

    ImportTextoVisible:
      type: object
      description: |
        Texto de presentacion (SPEC v0.3 RN-32). Presente en facturador, establecimientos, puntos y
        contextos. `editable` es true solo si la entidad se crea.
      properties:
        campo: { type: string }
        propuesto: { type: string, nullable: true }
        editable: { type: boolean }

    ImportFacturadorDiff:
      allOf:
        - $ref: "#/components/schemas/ImportEntityDiff"
        - type: object
          properties:
            emisor_id: { type: string }
            has_api_key:
              type: boolean
              description: RN-33. Si es false, el apply exige `api_key`. La clave nunca se expone.

    ImportContextoDiff:
      allOf:
        - $ref: "#/components/schemas/ImportEntityDiff"
        - type: object
          properties:
            ref:
              type: string
              description: |
                Identificador del contexto en este archivo; indexa los overrides. Igual al codigo de
                perfil, o `NO_REQUERIDO@<est>-<punto>` para emisores sin perfiles (RN-29).
            clave:
              type: object
              properties:
                actividad: { type: string }
                establecimiento: { type: string }
                punto: { type: string }
                perfil: { type: string }
            actividad_codigo:
              type: string
              description: Actividad efectiva del contexto (la del archivo, o la elegida).
            actividad_editable:
              type: boolean
              description: true cuando el perfil no fija actividad y el operador puede elegirla.
            actividad_opciones:
              type: array
              description: Actividades del grupo que existen en el archivo. Vacio si el perfil fija actividad.
              items:
                type: object
                properties:
                  codigo: { type: string }
                  descripcion: { type: string, nullable: true }
            documento_nro_sugerido:
              type: string
            documento_nro_editable:
              type: boolean
            documento_nro_preservado:
              type: boolean
            usuarios_asignados:
              type: integer

    FacturadorImportDiff:
      type: object
      properties:
        contrato:
          type: object
          properties:
            version: { type: string }
            generado_en: { type: string, nullable: true }
            archivo: { type: string }
            formato: { type: string }
        preview_token:
          type: string
        puede_aplicar:
          type: boolean
        tenant:
          type: object
        facturador:
          $ref: "#/components/schemas/ImportFacturadorDiff"
        establecimientos:
          type: array
          items: { $ref: "#/components/schemas/ImportEntityDiff" }
        puntos:
          type: array
          items: { $ref: "#/components/schemas/ImportEntityDiff" }
        actividades:
          type: array
          items: { $ref: "#/components/schemas/ImportEntityDiff" }
        perfiles:
          type: array
          items: { $ref: "#/components/schemas/ImportEntityDiff" }
        contextos:
          type: array
          items: { $ref: "#/components/schemas/ImportContextoDiff" }
        timbrado_elegido:
          type: object
          nullable: true
          properties:
            numero: { type: string }
            fecha_inicio: { type: string, nullable: true }
            fecha_fin: { type: string, nullable: true }
            motivo: { type: string }
        resumen:
          type: object
          properties:
            crear: { type: integer }
            actualizar: { type: integer }
            sin_cambios: { type: integer }
            no_tocados: { type: integer }
        bloqueantes:
          type: array
          items: { $ref: "#/components/schemas/ImportHallazgo" }
        advertencias:
          type: array
          items: { $ref: "#/components/schemas/ImportHallazgo" }
        ignorados:
          type: array
          items: { $ref: "#/components/schemas/ImportHallazgo" }
        referencias:
          type: object
          additionalProperties:
            type: string
          description: Ruta del archivo hacia el ancla de la guia FE que explica ese campo.

    FacturadorImportApplyResponse:
      allOf:
        - $ref: "#/components/schemas/FacturadorImportDiff"
        - type: object
          properties:
            aplicado:
              type: boolean
            tenant_id:
              type: string
              format: uuid
            facturador_id:
              type: string
              format: uuid
            aplicado_en:
              type: string
              format: date-time
            proximos_pasos:
              type: array
              items:
                type: string

    BackofficeUserCreateRequest:
      type: object
      required: [tenant_id, username, email, role]
      properties:
        tenant_id:
          type: string
          format: uuid
        username:
          type: string
          description: Username operativo. Puede ser alias tecnico o email del operador.
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        role:
          type: string
          enum: [OPERADOR_FACTURACION, SOPORTE_INTERNO, ADMIN_INTERNO]
        temporary_password:
          type: string
          format: password
          nullable: true
        operation_config:
          $ref: "#/components/schemas/BackofficeOperationConfigInline"

    BackofficeOperationConfigInline:
      type: object
      description: |
        Configuracion operativa opcional dentro del alta de usuario (alta guiada). Se crea en la
        misma transaccion que el usuario: si el contexto no resuelve, el usuario no se crea.
        Misma forma que la asignacion posterior, menos `tenant_id`, que se deriva del usuario.
      required: [facturador_id, emisor_id, establecimiento, punto_expedicion, perfil_emision_codigo, actividad_economica_codigo]
      properties:
        facturador_id:
          type: string
          format: uuid
        emisor_id:
          type: string
        establecimiento:
          type: string
          pattern: "^[0-9]{3}$"
        punto_expedicion:
          type: string
          pattern: "^[0-9]{3}$"
        perfil_emision_codigo:
          type: string
        actividad_economica_codigo:
          type: string

    BackofficePasswordResetRequest:
      type: object
      properties:
        temporary_password:
          type: string
          format: password
          nullable: true

    BackofficeUserResponse:
      type: object
      required: [id, username, role, active]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
        active:
          type: boolean
        temporary_password:
          type: string
          format: password
          nullable: true
          description: Solo se devuelve en creacion o reset; no se persiste en claro.

    UserOperationConfigRequest:
      type: object
      required: [tenant_id, facturador_id, emisor_id, establecimiento, punto_expedicion, perfil_emision_codigo, actividad_economica_codigo]
      properties:
        tenant_id:
          type: string
          format: uuid
        facturador_id:
          type: string
          format: uuid
        emisor_id:
          type: string
          description: RUC completo del emisor en FE (`numero-dv`), no ID interno numerico.
        establecimiento:
          type: string
        punto_expedicion:
          type: string
        perfil_emision_codigo:
          type: string
        actividad_economica_codigo:
          type: string

    UserOperationConfig:
      allOf:
        - $ref: "#/components/schemas/UserOperationConfigRequest"
        - type: object
          required: [user_id, active]
          properties:
            user_id:
              type: string
            active:
              type: boolean

    # ── Notas Comerciales ─────────────────────────────────────────────────────

    NotaTipo:
      type: string
      enum: [PRESUPUESTO, PEDIDO]
      description: >
        Tipo del documento comercial interno.
        `PRESUPUESTO` imprime "NOTA DE PRESUPUESTO"; `PEDIDO` imprime "NOTA DE PEDIDO".

    NotaEstado:
      type: string
      enum: [BORRADOR, EMITIDO]
      description: >
        Estado del documento. `BORRADOR` es editable; `EMITIDO` es inmutable y tiene PDF disponible.

    NotaFilaTipo:
      type: string
      enum: [CONTEXTO, ITEM, ITEM_SIN_PRECIO]
      description: >
        Tipo de fila en la tabla de items del PDF.
        `CONTEXTO`: fila en negrita sin precio (encabezado de seccion).
        `ITEM`: fila con cantidad, precio unitario y total calculado.
        `ITEM_SIN_PRECIO`: fila con descripcion sin precio visible (muestra "—").

    NotaFilaInput:
      type: object
      required: [orden, fila_tipo, descripcion]
      properties:
        orden:
          type: integer
          minimum: 0
          description: Posicion de la fila (0-based). Define el orden de aparicion en el PDF.
        fila_tipo:
          $ref: "#/components/schemas/NotaFilaTipo"
        descripcion:
          type: string
          minLength: 1
          maxLength: 500
        cantidad:
          type: number
          nullable: true
          description: Solo requerido para fila_tipo ITEM. Ignorado para CONTEXTO e ITEM_SIN_PRECIO.
        precio_unitario:
          type: number
          minimum: 0
          nullable: true
          description: Solo requerido para fila_tipo ITEM. Ignorado para los demas tipos.

    NotaFilaResponse:
      type: object
      required: [id, nota_id, orden, fila_tipo, descripcion]
      properties:
        id:
          type: string
          format: uuid
        nota_id:
          type: string
          format: uuid
        orden:
          type: integer
        fila_tipo:
          $ref: "#/components/schemas/NotaFilaTipo"
        descripcion:
          type: string
        cantidad:
          type: number
          nullable: true
        precio_unitario:
          type: number
          nullable: true
        precio_total:
          type: number
          nullable: true
          description: >
            cantidad * precio_unitario, calculado por el backend.
            Null para filas que no son ITEM.

    NotaRecord:
      type: object
      required: [id, facturador_id, tipo, estado, cliente_nombre, verification_token, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        facturador_id:
          type: string
          format: uuid
        tipo:
          $ref: "#/components/schemas/NotaTipo"
        numero:
          type: integer
          nullable: true
          description: Numero correlativo asignado al emitir. Null mientras BORRADOR.
        estado:
          $ref: "#/components/schemas/NotaEstado"
        fecha_emision:
          type: string
          format: date
          nullable: true
          description: Fecha de emision (YYYY-MM-DD). Asignada al emitir; null en BORRADOR.
        cliente_nombre:
          type: string
        cliente_ruc:
          type: string
          nullable: true
        verification_token:
          type: string
          format: uuid
          description: Token publico para el QR. Generado al crear; inmutable.
        emitido_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotaConItems:
      allOf:
        - $ref: "#/components/schemas/NotaRecord"
        - type: object
          required: [items, total]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotaFilaResponse"
              description: Filas ordenadas por `orden` ASC.
            total:
              type: number
              description: Suma de precio_total de todas las filas ITEM. Calculado por el backend.

    NotaListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotaRecord"
        total:
          type: integer
          description: Total de notas que cumplen el filtro (sin paginar).

    NotaCreateRequest:
      type: object
      required: [tipo, cliente_nombre]
      properties:
        tipo:
          $ref: "#/components/schemas/NotaTipo"
        cliente_nombre:
          type: string
          minLength: 1
          maxLength: 200
        cliente_ruc:
          type: string
          maxLength: 20
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotaFilaInput"
          default: []
          description: Lista de filas. Puede estar vacia al crear el borrador.

    NotaUpdateRequest:
      type: object
      description: Todos los campos son opcionales. Solo se pueden modificar notas en estado BORRADOR.
      properties:
        cliente_nombre:
          type: string
          minLength: 1
          maxLength: 200
        cliente_ruc:
          type: string
          maxLength: 20
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotaFilaInput"
          description: Si se incluye, reemplaza completamente la lista de items.

    NotaVerificacionResponse:
      type: object
      required: [valido]
      properties:
        valido:
          type: boolean
          example: true
        tipo:
          $ref: "#/components/schemas/NotaTipo"
        numero:
          type: integer
          nullable: true
        fecha_emision:
          type: string
          format: date
          nullable: true
        cliente_nombre:
          type: string
        cliente_ruc:
          type: string
          nullable: true
        emitido_at:
          type: string
          format: date-time
          nullable: true

    ReciboFormaPago:
      type: string
      enum: [EFECTIVO, TRANSFERENCIA, CHEQUE, TARJETA_CREDITO, TARJETA_DEBITO, OTRO]
      description: Forma de pago del recibo.

    ReciboRecord:
      type: object
      required:
        - id
        - facturador_id
        - estado
        - fecha_cobro
        - pagador_nombre
        - concepto
        - importe
        - forma_pago
        - verification_token
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        facturador_id:
          type: string
          format: uuid
        numero:
          type: integer
          nullable: true
          description: Numero correlativo asignado por facturacion-electronica al emitir. Null mientras el recibo esta en BORRADOR.
        estado:
          type: string
          enum: [BORRADOR, EMITIDO, ANULADO]
        fecha_cobro:
          type: string
          format: date
        pagador_nombre:
          type: string
        pagador_documento_tipo:
          type: string
          nullable: true
        pagador_documento:
          type: string
          nullable: true
        concepto:
          type: string
        importe:
          type: number
          format: double
        moneda:
          type: string
          default: PYG
        forma_pago:
          $ref: "#/components/schemas/ReciboFormaPago"
        referencia_bancaria:
          type: string
          nullable: true
        referencia_documento_uuid:
          type: string
          format: uuid
          nullable: true
          description: document_uuid de una factura propia que este recibo cobra (ver POST /facturas/{documentoId}/recibo).
        referencia_documento_numero_display:
          type: string
          nullable: true
        factura_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: Deprecado desde v0.5 — usar referencia_documento_uuid. Se conserva solo para recibos creados antes de v0.5.
        factura_numero_display:
          type: string
          nullable: true
          deprecated: true
          description: Deprecado desde v0.5 — usar referencia_documento_numero_display.
        xml_hash:
          type: string
          nullable: true
          description: Hash del XML firmado por facturacion-electronica (Ley N.º 6822/2021). Null mientras el recibo esta en BORRADOR.
        pdf_hash:
          type: string
          nullable: true
        anulacion_motivo:
          type: string
          nullable: true
          description: Motivo capturado en POST /recibos/{reciboId}/anular. Null salvo que estado sea ANULADO.
        verification_token:
          type: string
          format: uuid
          nullable: true
