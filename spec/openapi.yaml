  /facturas/{documentoId}/nota-credito/reintentar:
    post:
      tags: [NotasCredito]
      summary: Reintentar una nota de credito sin confirmar
      description: |
        `documentoId` es la nota. Vuelve a llamar a FE con la misma clave y los mismos datos
        (SPEC_NOTA_CREDITO_TRABADA_v0.1, RN-05). Con FE `segel-rc4` la nota se completa con el
        mismo numero, sin duplicarse. Si FE todavia no la confirma, sigue sin confirmar.
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      responses:
        "200":
          description: Nota actualizada (emitida, rechazada o todavia sin confirmar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La nota no esta pendiente de reintento, o FE responde `CREDIT_NOTE_TOTAL_EXCEEDED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: FE rechazo el pedido con un error que no corresponde a la nota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

