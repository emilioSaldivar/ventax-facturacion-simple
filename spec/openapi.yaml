        columna: { type: string }
        cantidad: { type: integer }
    CargaMasivaTotales:
      type: object
      description: Vacio mientras el backend fiscal no los informe.
      properties:
        lineas: { type: integer, nullable: true }
        comprobantes: { type: integer, nullable: true }
        invalidos: { type: integer }
        duplicados: { type: integer }
        pendientes: { type: integer }
        preparados: { type: integer }
        enviados: { type: integer }
        aprobados: { type: integer }
        aprobados_con_obs: { type: integer }
        rechazados: { type: integer }
        con_error: { type: integer }
        cancelados: { type: integer }
        con_advertencias: { type: integer }
        numeros_salteados: { type: integer }
        requieren_atencion:
          type: integer
          description: 'Comprobantes con un numero sin resolver (SPEC_CARGA_ATENCION_COMPROBANTES_v0.1). La carga no termina mientras haya alguno. Ausente si el backend fiscal no lo informa.'
        lotes_enviados: { type: integer }
        lotes_en_proceso: { type: integer }
        lotes_concluidos: { type: integer }
    CargaMasivaAcciones:
      type: object
