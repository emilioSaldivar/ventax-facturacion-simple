        display_name: { type: string, nullable: true }
    CargaMasivaResponse:
      type: object
      required: [id, fe_carga_id, estado, tamano_bytes, numeracion, totales, acciones, motivos, fechas, contexto, subida_por, created_at]
      properties:
        id: { type: string, format: uuid }
        fe_carga_id: { type: string }
        estado: { $ref: '#/components/schemas/CargaMasivaEstado' }
        nombre_archivo: { type: string, nullable: true }
        tamano_bytes: { type: integer }
        numeracion: { type: string, enum: [SERVICIO, CLIENTE] }
        tipo_documento: { type: string, enum: [FACTURA, NOTA_REMISION] }
        totales: { $ref: '#/components/schemas/CargaMasivaTotales' }
        acciones: { $ref: '#/components/schemas/CargaMasivaAcciones' }
        motivos:
          type: array
          items: { $ref: '#/components/schemas/CargaMasivaProblema' }
        fechas:
          type: object
          properties:
            recibida_en: { type: string, format: date-time, nullable: true }
            validada_en: { type: string, format: date-time, nullable: true }
            confirmada_en: { type: string, format: date-time, nullable: true }
            iniciada_en: { type: string, format: date-time, nullable: true }
            finalizada_en: { type: string, format: date-time, nullable: true }
            cancelada_en: { type: string, format: date-time, nullable: true }
        contexto:
          type: object
          properties:
            perfil: { type: string, nullable: true }
            establecimiento: { type: string, nullable: true }
            punto: { type: string, nullable: true }
            actividad: { type: string, nullable: true }
        subida_por: { $ref: '#/components/schemas/CargaMasivaUsuario' }
        confirmada_por:
          allOf: [{ $ref: '#/components/schemas/CargaMasivaUsuario' }]
          nullable: true
        cancelada_por:
          allOf: [{ $ref: '#/components/schemas/CargaMasivaUsuario' }]
          nullable: true
        sincronizada_en: { type: string, format: date-time, nullable: true }
        sync_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        repetida: { type: boolean, description: 'Solo en la subida.' }
    CargaMasivaListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CargaMasivaResponse' }
        total: { type: integer }
    CargaMasivaComprobante:
      type: object
      description: Forma del comprobante del backend fiscal, mas `documento_id`.
      required: [orden, estado, errores, advertencias, documento_id]
      properties:
        orden: { type: integer }
        filas:
          type: array
          items: { type: integer }
        tipo_documento: { type: string }
        numero_archivo: { type: string, nullable: true }
        numero_asignado: { type: string, nullable: true }
        referencia_venta: { type: string, nullable: true }
        estado:
          type: string
          enum: [PENDIENTE, INVALIDO, DUPLICADO, PREPARADO, ENVIADO, APROBADO, APROBADO_CON_OBS, RECHAZADO, ERROR, CANCELADO]
        errores:
          type: array
          items: { $ref: '#/components/schemas/CargaMasivaProblema' }
        advertencias:
          type: array
          items: { $ref: '#/components/schemas/CargaMasivaProblema' }
        document_uuid: { type: string, nullable: true }
        cdc: { type: string, nullable: true }
        documento_estado: { type: string, nullable: true }
        lote: { type: string, nullable: true }
        sifen:
          type: object
          nullable: true
          properties:
            codigo: { type: string }
            mensaje: { type: string, nullable: true }
        correo: { type: string, nullable: true, enum: [PENDING, SENT, FAILED, null] }
        aprobado_en: { type: string, format: date-time, nullable: true }
        actualizado_en: { type: string, format: date-time }
        atencion:
          type: object
          nullable: true
          description: 'Numero sin resolver: invalido o cancelado con numeracion del cliente, o rechazado por SIFEN, sin inutilizar. Lo decide el backend fiscal.'
          properties:
            motivo: { type: string, enum: [NUMERO_SIN_USAR, RECHAZADO_POR_SIFEN] }
            numero: { type: string, example: '001-001-0000007' }
        inutilizacion:
          type: object
          nullable: true
          description: Ultima inutilizacion que cubre el numero del comprobante.
          properties:
            evento_id: { type: string }
            estado: { type: string, description: '`PENDING`, `ACCEPTED`, `REJECTED` o `FAILED`.' }
            numero: { type: string }
        acciones:
          type: object
          properties:
            puede_inutilizar: { type: boolean }
            puede_editar: { type: boolean, description: 'Reservado: hoy siempre `false`.' }
        detalle: { type: object, nullable: true, description: 'Solo con `detalle=true`.' }
        documento_id: { type: string, format: uuid, nullable: true, description: 'Documento de FS con ese `document_uuid`.' }
