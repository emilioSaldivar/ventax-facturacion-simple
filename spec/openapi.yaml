openapi: 3.0.3
info:
  title: Facturacion Simple Cliente SaaS API
  version: 0.1.0
  description: |
    API propia del SaaS Facturacion Simple Cliente.

    Este contrato cubre la aplicacion operativa mobile-first y el backoffice interno minimo.
    La autoridad fiscal sigue siendo `facturacion-electronica` Ventax.

    Reglas base:
    - El operador emite para un unico facturador asociado.
    - No se guardan borradores.
    - Los precios unitarios son enteros en PYG e incluyen IVA.
    - Base imponible e IVA se redondean por linea.
    - La liquidacion por tasa suma lineas ya redondeadas.
    - El link publico usa token opaco, no CDC puro ni ID secuencial.
    - El envio fiscal operativo por defecto es `BATCH`: el SaaS encola por outbox y `facturacion-electronica` despacha comprobantes a SIFEN por lotes.
servers:
  - url: /api/v1

tags:
  - name: System
  - name: Auth
  - name: Contexto
  - name: Clientes
  - name: Catalogo
  - name: Facturas
  - name: NotasCredito
  - name: Entrega
  - name: Backoffice
  - name: Notas
  - name: Recibos
  - name: Cargas
  - name: Public

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Healthcheck del SaaS
      security: []
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /fiscal-gateway/health:
    get:
      tags: [System]
      summary: Healthcheck del backend fiscal configurado
      responses:
        "200":
          description: Estado normalizado del gateway fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalGatewayHealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesion iniciada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token httpOnly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/AccountLocked"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token usando cookie httpOnly
      security: []
      responses:
        "200":
          description: Token renovado
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh token httpOnly rotado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesion y revocar refresh token
      responses:
        "204":
          description: Sesion cerrada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie de refresh limpiada.

  /me/context:
    get:
      tags: [Contexto]
      summary: Obtener contexto operativo del usuario
      description: |
        Devuelve el unico facturador, establecimiento, punto, perfil de emision
        y actividad economica efectiva asociados al operador.
      responses:
        "200":
          description: Contexto operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalContextResponse"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/readiness:
    get:
      tags: [Contexto]
      summary: Readiness operativo para emitir
      responses:
        "200":
          description: Estado de readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /clientes/search:
    get:
      tags: [Clientes]
      summary: Buscar cliente por documento en agenda y base compartida
      description: >-
        La agenda del facturador se busca por fragmento de documento o de razon social. La base
        compartida solo responde al documento exacto, y sin direccion, telefono ni email.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
          description: RUC, CI, nombre o razon social.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: Resultados de busqueda
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClienteSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clientes:
    get:
      tags: [Clientes]
      summary: Listar agenda de clientes del facturador del usuario
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Clientes]
      summary: Crear cliente en agenda del facturador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpsertRequest"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /clientes/{clienteId}:
    patch:
      tags: [Clientes]
      summary: Actualizar cliente de la agenda del facturador
      parameters:
        - $ref: "#/components/parameters/ClienteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpsertRequest"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Clientes]
      summary: Eliminar cliente de la agenda del facturador
      parameters:
        - $ref: "#/components/parameters/ClienteId"
      responses:
        "204":
          description: Cliente eliminado de la agenda
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /clientes/dnit/autocomplete:
    get:
      tags: [Clientes]
      summary: Autocompletar identidad desde padron DNIT para RUC o CI
      parameters:
        - in: query
          name: documento_tipo
          required: true
          schema:
            type: string
            enum: [RUC, CI]
        - in: query
          name: documento
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 40
          description: Documento con o sin DV (ej. 1001210 o 1001210-9).
      responses:
        "200":
          description: Resultado de autocompletado DNIT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnitAutocompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /catalogo/items/search:
    get:
      tags: [Catalogo]
      summary: Buscar productos o servicios desde el campo codigo
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          description: Codigo, nombre o descripcion.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: Resultados de catalogo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogoItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalogo/items:
    get:
      tags: [Catalogo]
      summary: Listar catalogo del facturador
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: activo
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Lista de items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Catalogo]
      summary: Crear producto o servicio
      description: |
        Si se crea desde el editor de factura sin IVA explicito, el backend usa IVA 10%.
        Items con IVA 5% o EXENTA deben crearse desde pantalla de catalogo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogoItemUpsertRequest"
      responses:
        "201":
          description: Item creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Conflicto de codigo o usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /catalogo/items/{itemId}:
    patch:
      tags: [Catalogo]
      summary: Actualizar producto o servicio
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogoItemUpsertRequest"
      responses:
        "200":
          description: Item actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Conflicto de codigo o usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalogo]
      summary: Eliminar permanentemente producto o servicio
      description: Borra fisicamente el item del catalogo del facturador actual.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Item eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/preview:
    post:
      tags: [Facturas]
      summary: Validar y calcular totales antes de emitir
      description: |
        No persiste borrador. Solo devuelve validaciones, lineas normalizadas y totales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturaPreviewRequest"
      responses:
        "200":
          description: Preview calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturaPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Usuario sin configuracion operativa completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /facturas:
    get:
      tags: [Facturas]
      summary: Listar facturas y notas emitidas del facturador del usuario
      description: |
        La busqueda opera sobre datos SaaS persistidos localmente.
        Semantica:
        - `q` busca por OR en `numero_fiscal`, `cdc`, `receptor_doc` y `receptor_nombre`.
        - `q` usa `contains` case-insensitive para texto y prefijo para `numero_fiscal`/`cdc`.
        - `desde` y `hasta` se interpretan en `America/Asuncion`, son inclusivos, y filtran por
          fecha operativa `fecha_emision` (fallback `created_at` cuando no existe emision confirmada).
        - Filtros `q`, `desde/hasta`, `tipo_operativo` y `estado` se combinan por AND.
      parameters:
        - in: query
          name: carga_id
          description: Solo las facturas de esa carga masiva.
          schema:
            type: string
            format: uuid
        - in: query
          name: tipo
          schema:
            $ref: "#/components/schemas/DocumentoTipo"
        - in: query
          name: tipo_operativo
          description: "Filtro operativo para UI: facturas contado, facturas credito o notas de credito."
          schema:
            $ref: "#/components/schemas/DocumentoTipoOperativo"
        - in: query
          name: estado
          schema:
            $ref: "#/components/schemas/DocumentoEstado"
        - in: query
          name: desde
          schema:
            type: string
            format: date
        - in: query
          name: hasta
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Facturas]
      summary: Encolar emision de Factura Electronica contado o credito
      description: |
        Valida y persiste la factura operativa sin crear borrador.
        La llamada a `facturacion-electronica` se procesa por outbox/worker usando
        `external_ref` idempotente y `envio.mode=BATCH` por defecto para el
        facturador. La respuesta inicial puede quedar `EMITIENDO` o
        `PENDIENTE_SIFEN` mientras SIFEN procesa el lote; el numero fiscal, CDC,
        datos de lote y estado final vienen del backend fiscal.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturaEmitRequest"
      responses:
        "201":
          description: Factura emitida o en proceso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoResponse"
        "400":
          description: Header `Idempotency-Key` ausente o invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotencia o conflicto de estado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /facturas/nce-candidatas:
    get:
      tags: [Facturas]
      summary: Listar facturas candidatas para emitir Nota de Credito Electronica
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Facturas candidatas con elegibilidad operativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotaCreditoCandidateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /facturas/{documentoId}:
    get:
      tags: [Facturas]
      summary: Obtener detalle de factura o nota
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      responses:
        "200":
          description: Documento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /facturas/{documentoId}/eventos:
    get:
      tags: [Facturas]
      summary: Consultar historial del documento (soporte interno)
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      responses:
        "200":
          description: Historial de eventos del documento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoEventosListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disponible solo para soporte interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Documento sin CDC fiscal para historial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Backend fiscal no disponible o rechazo la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout al consultar backend fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/{documentoId}/gestion/decision:
    get:
      tags: [Facturas]
      summary: Consultar decision operativa de autogestion (soporte interno)
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      responses:
        "200":
          description: Diagnostico y accion recomendada para regularizacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoDecisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disponible solo para soporte interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Backend fiscal no disponible o rechazo la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout al consultar backend fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/{documentoId}/gestion/validate-cdc-impact:
    post:
      tags: [Facturas]
      summary: Prevalidar impacto CDC antes de regularizacion (soporte interno)
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoGestionValidateCdcImpactRequest"
      responses:
        "200":
          description: Resultado de prevalidacion CDC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoValidateCdcImpactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disponible solo para soporte interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Fuera de ventana operativa o documento no elegible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Backend fiscal no disponible o rechazo la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout al consultar backend fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/{documentoId}/gestion/retry-same-cdc:
    post:
      tags: [Facturas]
      summary: Reintentar documento preservando CDC (soporte interno)
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoGestionActionRequest"
      responses:
        "200":
          description: Reintento ejecutado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoGestionResendResponse"
        "202":
          description: Reencolado para batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoGestionResendResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disponible solo para soporte interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Fuera de ventana operativa o documento no elegible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/{documentoId}/gestion/create-derived:
    post:
      tags: [Facturas]
      summary: Crear nuevo DE derivado con nueva numeracion/CDC (soporte interno)
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoGestionActionRequest"
      responses:
        "201":
          description: DE derivado creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoGestionCreateDerivedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disponible solo para soporte interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Fuera de ventana operativa o documento no elegible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /facturas/{documentoId}/gestion/cancel-send:
    post:
      tags: [Facturas]
      summary: Cancelar envio local de documento en cola batch (soporte interno)
      parameters:
        - $ref: "#/components/parameters/DocumentoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoGestionCancelSendRequest"
      responses:
        "200":
          description: Envio local cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentoGestionCancelSendResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Disponible solo para soporte interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Fuera de ventana operativa o documento no elegible
          content:
            application/json:
              schema:
