          description: Recibo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Recibos]
      summary: Actualizar recibo en BORRADOR
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReciboUpdateRequest"
      responses:
        "200":
          description: Recibo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [Recibos]
      summary: Eliminar recibo en BORRADOR (soft delete)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Recibo eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /recibos/{reciboId}/emitir:
    parameters:
      - $ref: "#/components/parameters/ReciboId"
    post:
      tags: [Recibos]
      summary: Emitir recibo (BORRADOR → EMITIDO, asigna numero correlativo)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recibo emitido con numero asignado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /recibos/{reciboId}/anular:
    parameters:
      - $ref: "#/components/parameters/ReciboId"
    post:
      tags: [Recibos]
      summary: Anular un recibo emitido (genera un recibo de anulacion firmado)
      description: |
        Solo aplica sobre un recibo EMITIDO. El XML/PDF firmado original no se modifica,
        solo cambia su estado a ANULADO. Delegado a facturacion-electronica
        (POST /v1/recibos/{id}/anular, Ley N.º 6822/2021).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReciboAnularRequest"
      responses:
        "200":
          description: Recibo anulado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /recibos/{reciboId}/pdf:
    parameters:
      - $ref: "#/components/parameters/ReciboId"
    get:
      tags: [Recibos]
      summary: Descargar PDF del recibo
      description: |
        BORRADOR: vista previa sin firmar generada bajo demanda por facturacion-electronica.
        EMITIDO/ANULADO: PDF firmado (PAdES) persistido, siempre los mismos bytes.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: PDF del recibo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /recibos/{reciboId}/xml:
    parameters:
      - $ref: "#/components/parameters/ReciboId"
    get:
      tags: [Recibos]
      summary: Descargar XML firmado del recibo
      description: Solo disponible si el recibo esta EMITIDO o ANULADO (XMLDSig, Ley N.º 6822/2021).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: XML firmado del recibo
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /facturas/{documentoId}/recibo:
    parameters:
      - $ref: "#/components/parameters/DocumentoId"
    post:
      tags: [Recibos]
      summary: Crear recibo pre-llenado desde factura a credito
      description: >
        Solo funciona para facturas con condicion_venta = CREDITO.
        Pre-llena pagador, importe y referencia con los datos de la factura.
        El recibo creado queda en estado BORRADOR para revision antes de emitir.
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Recibo creado pre-llenado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /verificar/recibo/{token}:
    get:
      tags: [Recibos]
      summary: Verificar autenticidad de un recibo por QR token
      description: >
        Endpoint publico sin autenticacion. El QR del PDF apunta a esta URL.
        Devuelve 200 con datos si el recibo esta EMITIDO; 404 si el token no existe
        o corresponde a un BORRADOR.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          description: verification_token del recibo (uuid v4).
      responses:
        "200":
          description: Recibo valido y emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciboVerificacionResponse"
        "404":
          description: Token inexistente o recibo en estado BORRADOR
          content:
            application/json:
              schema:
                type: object
                required: [valido]
                properties:
                  valido:
                    type: boolean
                    example: false

  /verificar/recibo/{token}/pdf:
    get:
      tags: [Recibos]
      summary: Descargar el PDF publico de un recibo por QR token
      description: >
        Endpoint publico sin autenticacion. Devuelve el PDF del recibo si esta
        EMITIDO; 404 si el token no existe o corresponde a un BORRADOR.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          description: verification_token del recibo (uuid v4).
      responses:
        "200":
          description: PDF del recibo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Token inexistente o recibo en estado BORRADOR
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: NOT_FOUND

  /verificar/nota/{token}:
    get:
      tags: [Notas]
      summary: Verificar autenticidad de una nota por QR token
      description: >
        Endpoint publico sin autenticacion. El QR del PDF apunta a esta URL.
        Devuelve 200 con datos si la nota esta EMITIDA; 404 si el token no existe
        o corresponde a un BORRADOR.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
          description: verification_token generado al crear la nota (uuid v4).
      responses:
        "200":
          description: Nota valida y emitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotaVerificacionResponse"
        "404":
          description: Token inexistente o nota en estado BORRADOR
          content:
            application/json:
              schema:
                type: object
                required: [valido]
                properties:
                  valido:
                    type: boolean
                    example: false

  /cargas:
    get:
      tags: [Cargas]
      summary: Lista las cargas del contexto del operador, o del facturador para roles internos
      description: Desde la copia local, sin llamar al backend fiscal. Con `CARGA_MASIVA_ENABLED=false`, toda ruta `/cargas` responde `404`.
      parameters:
        - { name: estado, in: query, schema: { type: string }, description: 'Uno o varios estados separados por coma.' }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Cargas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cargas]
      summary: Sube un archivo de ventas
      description: |
        El archivo es el cuerpo del pedido y se entrega sin modificar al backend fiscal. No emite nada.
        `details.reason` puede ser `TIPO_DE_CONTENIDO_NO_ADMITIDO` (415), `ARCHIVO_VACIO` (422), `SUBIDAS_SIMULTANEAS` (429),
        `CONTEXTO_NO_LISTO`, `SIN_CLAVE_DE_CONSUMIDOR`, `ARCHIVO_YA_SUBIDO_EN_OTRO_CONTEXTO` o `CARGA_MASIVA_NO_HABILITADA_EN_FE` (409),
        y `FE_NO_DISPONIBLE` (502). Los `403`, `413`, `415`, `422` y `429` del backend fiscal conservan su mensaje y traen `details.fe_code`.
      parameters:
        - { name: nombre_archivo, in: query, schema: { type: string, maxLength: 200 } }
        - { name: tipo_documento, in: query, schema: { type: string, enum: [FACTURA, NOTA_REMISION], default: FACTURA }, description: 'SPEC_DOCUMENTOS_ESCRITORIO_v0.1, fase B1: una carga, un tipo. Otro valor responde `400` con `reason: TIPO_NO_HABILITADO`.' }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Carga creada, en `RECIBIDA`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaResponse' }
        '200':
          description: El archivo ya se habia subido. Devuelve esa carga, con `repetida` en `true`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaResponse' }
        '409': { description: 'Ver `details.reason`.' }
        '413': { description: 'Archivo sobre el tope. `details.tope_bytes`.' }
        '415': { description: 'Tipo de contenido no admitido.' }
        '422': { description: 'Archivo vacio, o parametros que no corresponden al emisor (`details.motivos`).' }
        '429': { description: 'Demasiadas subidas, cargas en espera o cuota diaria. Trae `Retry-After`.' }
        '502': { description: 'Backend fiscal no disponible.' }
  /cargas/plantilla:
    get:
      tags: [Cargas]
      summary: Descarga la plantilla del archivo
      parameters:
        - { name: tipo_documento, in: query, schema: { type: string, enum: [FACTURA, NOTA_REMISION], default: FACTURA } }
      responses:
        '200':
          description: Plantilla CSV
          content:
            text/csv:
              schema: { type: string }
  /cargas/ejemplos:
    get:
      tags: [Cargas]
      summary: Ejemplos de planilla del tipo elegido (SPEC_PLANILLAS_EJEMPLO_v0.1)
      parameters:
        - { name: tipo_documento, in: query, schema: { type: string, enum: [FACTURA, NOTA_REMISION], default: FACTURA } }
      responses:
        '200':
          description: 'Lista del backend fiscal, ordenada por tipo de cliente, condicion y temas, sin sus rutas internas.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tipo_documento: { type: string }
                  ejemplos:
                    type: array
                    items:
                      type: object
                      properties:
                        codigo: { type: string }
                        titulo: { type: string }
                        descripcion: { type: string }
                        tipo_cliente: { type: string, enum: [B2C, B2B, B2G, B2F] }
                        condicion: { type: string }
                        temas: { type: array, items: { type: string } }
                        procesamiento_disponible: { type: boolean }
  /cargas/ejemplos/{codigo}:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9_]{1,60}$' } }
    get:
      tags: [Cargas]
      summary: Descarga un ejemplo listo para subir, con el punto y la numeracion del contexto del operador
      parameters:
        - { name: tipo_documento, in: query, schema: { type: string, enum: [FACTURA, NOTA_REMISION], default: FACTURA } }
      responses:
        '200':
          description: CSV adjunto
          content:
            text/csv:
              schema: { type: string }
        '400': { description: 'Codigo invalido.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'El backend fiscal no puede armar el ejemplo para este punto (`CARGA_PARAMETROS_INVALIDOS`, con motivos).' }
  /cargas/diccionario:
    get:
      tags: [Cargas]
      summary: Documentacion de la planilla del tipo elegido, para descargar
      parameters:
        - { name: tipo_documento, in: query, schema: { type: string, enum: [FACTURA, NOTA_REMISION], default: FACTURA } }
        - { name: formato, in: query, schema: { type: string, enum: [pdf, md], default: pdf } }
      responses:
        '200':
          description: PDF o Markdown adjunto
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/markdown:
              schema: { type: string }
        '400': { description: 'Formato invalido.' }
  /cargas/{cargaId}:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Cargas]
      summary: Detalle de una carga, refrescado desde el backend fiscal
      description: Si el backend fiscal falla, devuelve la copia local con `sincronizada_en` y `sync_error`. Una carga ajena responde `404`.
      responses:
        '200':
          description: Carga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cargas/{cargaId}/comprobantes:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Cargas]
      summary: Comprobantes de una carga
      parameters:
        - { name: estado, in: query, schema: { type: string }, description: 'Uno o varios estados separados por coma.' }
        - { name: con_advertencias, in: query, schema: { type: boolean } }
        - { name: detalle, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Comprobantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaComprobantesResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cargas/{cargaId}/confirmar:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Cargas]
      summary: Confirma la carga. Emite facturas reales
      responses:
        '200':
          description: Carga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaResponse' }
        '409': { description: '`details.reason`: `CARGA_ACCION_NO_ADMITIDA` (con `estado` y `acciones`) o `CONTEXTO_NO_LISTO`.' }
  /cargas/{cargaId}/cancelar:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Cargas]
      summary: Cancela lo que no se preparo. Lo ya preparado sigue su curso
      responses:
        '200':
          description: Carga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaResponse' }
        '409': { description: '`details.reason`: `CARGA_ACCION_NO_ADMITIDA`, con `estado` y `acciones`.' }
  /cargas/{cargaId}/reintentar:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Cargas]
      summary: Vuelve a preparar los comprobantes en `ERROR`
      responses:
        '200':
          description: Carga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaResponse' }
        '409': { description: '`details.reason`: `CARGA_ACCION_NO_ADMITIDA`, con `estado` y `acciones`.' }
  /cargas/{cargaId}/comprobantes/{orden}/inutilizar:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orden, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Cargas]
      summary: Inutiliza en SIFEN el numero de un comprobante que requiere atencion
      description: 'SPEC_CARGA_ATENCION_COMPROBANTES_v0.1. No exige contexto listo para emitir. Queda en auditoria como `CARGA_COMPROBANTE_INUTILIZADO`. No se puede deshacer.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 5, maxLength: 150 }
      responses:
        '200':
          description: Evento enviado y comprobante actualizado
          content:
            application/json:
              schema:
                type: object
                required: [evento, comprobante]
                properties:
                  evento: { type: object, description: 'Resultado del evento de inutilizacion, tal como lo devuelve el backend fiscal.' }
                  comprobante: { $ref: '#/components/schemas/CargaMasivaComprobante' }
        '400': { description: 'Orden o motivo invalidos.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`details.reason`: `COMPROBANTE_SIN_ATENCION`, `EVENT_IN_PROGRESS`, `EVENT_ALREADY_EXISTS`, `RANGE_ALREADY_USED` o `RANGE_POSSIBLY_CONSUMED`, el codigo del backend fiscal.' }
  /cargas/{cargaId}/resultado:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Cargas]
      summary: Descarga el CSV de resultado, una fila por comprobante
      responses:
        '200':
          description: Resultado, reenviado tal como lo entrega el backend fiscal
          content:
            text/csv:
              schema: { type: string }
  /cargas/{cargaId}/lotes:
    parameters:
      - { name: cargaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Cargas]
      summary: Lotes SIFEN de la carga. Solo roles internos
      responses:
        '200':
          description: Lotes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaMasivaLoteListResponse' }
        '403': { description: 'Rol sin permiso.' }
  /public/d/{token}:
    get:
      tags: [Public]
      summary: Ver comprobante publico por token opaco
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Vista publica del documento
          content:
            text/html:
              schema:
                type: string
                description: Pagina HTML publica para cliente final cuando el cliente HTTP acepta HTML.
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/d/{token}/kude.pdf:
    get:
      tags: [Public]
      summary: Descargar KUDE/PDF publico
      description: >
        Proxy publico del KUDE/PDF fiscal por CDC. La descarga no requiere que el
        documento este aprobado en SIFEN; si existe CDC y el backend fiscal tiene
        XML local suficiente para generar KUDE, el artefacto debe estar disponible
        tambien para estados pendientes o rechazados.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicToken"
      responses:
        "200":
          description: KUDE/PDF fiscal proxied desde Ventax FE
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Backend fiscal no disponible o rechazo la descarga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout al descargar desde backend fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/d/{token}/xml:
    get:
      tags: [Public]
      summary: Descargar XML publico
      description: >
        Proxy publico del XML fiscal por CDC. La descarga no requiere que el
        documento este aprobado en SIFEN; si existe CDC y XML local en el backend
        fiscal, el artefacto debe estar disponible tambien para estados pendientes
        o rechazados.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicToken"
      responses:
        "200":
          description: XML fiscal proxied desde Ventax FE
          content:
            application/xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Backend fiscal no disponible o rechazo la descarga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout al descargar desde backend fiscal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backoffice/facturadores/import/preview:
    post:
      tags: [Backoffice]
      summary: Vista previa del import de configuracion fiscal
      description: |
        Recibe el archivo exportado por facturacion-electronica (JSON o YAML, como texto en el
        cuerpo), lo valida y lo mapea contra el estado actual, sin escribir nada.

        Responde **200 aun cuando haya bloqueantes**, con `puede_aplicar: false`: el objetivo es
        que el operador vea el informe completo de una sola vez. El 400 queda reservado a un
        archivo que no parsea o que no cumple el contrato.

        Un perfil de emision puede no fijar actividad economica (`actividad_codigo: null`, cuando en
        FE su `modo_actividad` es `SELECCIONADA` o `MULTIPLE`). En ese caso el contexto llega con
        `actividad_editable: true` y las opciones de su `grupo_actividades`, para que el operador
        elija cual queda fijada y la envie en `actividad_overrides` al aplicar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturadorImportPreviewRequest"
      responses:
        "200":
          description: Diff calculado (con o sin bloqueantes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturadorImportDiff"
        "400":
          description: Archivo invalido o fuera del contrato v0.1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: El cuerpo supera el limite admitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backoffice/facturadores/import/apply:
    post:
      tags: [Backoffice]
      summary: Aplicar el import de configuracion fiscal
      description: |
        Repite el calculo de la vista previa y persiste todo en **una unica transaccion**.
        Es aditivo: nunca borra ni desactiva entidades.

        El `preview_token` se recalcula dentro de la transaccion; si el estado cambio desde la
        vista previa, se rechaza con `409` y `details.motivo = PREVIEW_DESACTUALIZADO`.

        SPEC v0.3:
        - `api_key` es obligatoria si el facturador se crea o no tiene clave (RN-33). Se guarda en
          la misma transaccion y nunca se devuelve ni se audita: la respuesta solo informa
          `facturador.has_api_key`.
        - Los textos visibles (`nombre_fantasia`, nombres de establecimiento y punto, alias de
          contexto) se editan con `textos_overrides` solo al crear (RN-32). Sobre entidades
          existentes se conservan los actuales salvo `adoptar_textos_archivo: true` (RN-34).
        - Un emisor sin perfiles (`perfiles_emision.items: []` con `requerido: false`) se importa
          con el perfil centinela `NO_REQUERIDO`, un contexto por punto (RN-28, RN-29).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturadorImportApplyRequest"
      responses:
        "200":
          description: Import aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturadorImportApplyResponse"
        "409":
          description: |
            Bloqueado. `details.motivo` distingue el caso:
            `IMPORT_BLOQUEADO` (quedan bloqueantes) o `PREVIEW_DESACTUALIZADO` (el estado cambio).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Falta la API key del consumidor FE (`details.motivo = API_KEY_REQUERIDA`). No se
            escribio nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backoffice/users:
    post:
      tags: [Backoffice]
      summary: Crear usuario operativo o interno
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackofficeUserCreateRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackofficeUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permiso de backoffice requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            El facturador no tiene API key de FE (`details.motivo = FACTURADOR_SIN_API_KEY`).
            No se asignan usuarios operativos a un facturador que no puede emitir (SPEC import v0.3 RN-33).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backoffice/users/{userId}/reset-password:
    post:
      tags: [Backoffice]
      summary: Desbloquear usuario y definir o regenerar password temporal
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackofficePasswordResetRequest"
      responses:
        "200":
          description: Password temporal generado o actualizado; sesiones activas revocadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackofficeUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permiso de backoffice requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /backoffice/users/{userId}/operation-config:
    put:
      tags: [Backoffice]
      summary: Asociar configuracion operativa unica al usuario
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOperationConfigRequest"
      responses:
        "200":
          description: Configuracion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOperationConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permiso de backoffice requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario o configuracion operativa no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            El facturador no tiene API key de FE (`details.motivo = FACTURADOR_SIN_API_KEY`).
            No se asignan usuarios operativos a un facturador que no puede emitir (SPEC import v0.3 RN-33).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Q:
      in: query
      name: q
      required: false
      schema:
        type: string
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    ClienteId:
      in: path
      name: clienteId
      required: true
      schema:
        type: string
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
    DocumentoId:
      in: path
      name: documentoId
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 120
    NotaId:
      in: path
      name: notaId
      required: true
      schema:
        type: string
        format: uuid
      description: ID interno de la nota comercial.

    ReciboId:
      in: path
      name: reciboId
      required: true
      schema:
        type: string
        format: uuid
      description: ID interno del recibo de dinero.

    PublicToken:
      in: path
      name: token
      required: true
      schema:
        type: string
        minLength: 32

  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: Usuario bloqueado por intentos fallidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Error de validacion
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: facturacion-simple-cliente

    FiscalGatewayHealthResponse:
      type: object
      required: [ok, mode]
      properties:
        ok:
          type: boolean
        mode:
          type: string
          enum: [mock, real]
        status:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Datos invalidos
        details:
          type: object
          nullable: true
          additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username operativo. Puede ser alias tecnico o email del operador.
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
          nullable: true
        role:
          type: string
          enum: [OPERADOR_FACTURACION, SOPORTE_INTERNO, ADMIN_INTERNO]

    OperationalContextResponse:
      type: object
      required: [user, tenant, facturador, fiscal_context, display]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        tenant:
          $ref: "#/components/schemas/TenantSummary"
        facturador:
          $ref: "#/components/schemas/FacturadorSummary"
        fiscal_context:
          $ref: "#/components/schemas/FiscalContext"
        display:
          $ref: "#/components/schemas/OperationalDisplay"
        carga_masiva_habilitada:
          type: boolean
          description: La instancia tiene encendida la carga masiva (`CARGA_MASIVA_ENABLED`).
        nc_moneda_extranjera_habilitada:
          type: boolean
          description: FE admite la nota de credito de una factura en moneda extranjera, en la moneda de la factura (`FE_NC_MONEDA_EXTRANJERA`). Apagada, esa nota se bloquea con el motivo `NOTA_CREDITO_MONEDA_EXTRANJERA`.

    TenantSummary:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CANCELLED]

    FacturadorSummary:
      type: object
      required: [id, emisor_id, razon_social, ruc]
      properties:
        id:
          type: string
        emisor_id:
          type: string
          description: RUC completo del emisor en `facturacion-electronica` (formato numero-dv, ejemplo `80136968-1`).
        razon_social:
          type: string
        ruc:
          type: string
        nombre_fantasia:
          type: string
          nullable: true
          description: Nombre fantasia usado solo para visualizacion/UX del SaaS; no reemplaza razon social fiscal ni se envia a fe-api.

    FiscalContext:
      type: object
      required: [establecimiento, punto_expedicion, perfil_emision_codigo, actividad_economica_codigo, timbrado, timbrado_inicio, documento_nro, credito_plazo_dias, tipo_transaccion_default, fiscal_envio_modo]
      properties:
        establecimiento:
          type: string
          example: "001"
        punto_expedicion:
          type: string
          example: "001"
        perfil_emision_codigo:
          type: string
          example: SERV
        perfil_emision_alias:
          type: string
          nullable: true
          description: Alias visual para la combinacion actividad/perfil asignada al usuario; no altera el contrato fiscal con fe-api.
        actividad_economica_codigo:
          type: string
          example: "82110"
        actividad_economica_descripcion:
          type: string
          nullable: true
        actividad_economica_alias:
          type: string
          nullable: true
          description: Alias visual de la actividad economica activa para UX operativa.
        timbrado:
          type: string
          example: "80136968"
        timbrado_inicio:
          type: string
          format: date
          example: "2025-12-30"
        documento_nro:
          type: string
          description: Numero sugerido/fixture operativo enviado al backend fiscal; la numeracion final la asigna Ventax FE.
          example: "0000000"
        credito_plazo_dias:
          type: integer
          minimum: 1
          example: 30
        numeracion_facturas:
          type: string
          enum: [SERVICIO, CLIENTE]
          description: >-
            Forma de numerar las facturas de este contexto. `SERVICIO`: la numera el backend fiscal.
            `CLIENTE`: el numero viene en el archivo de una carga masiva, y `POST /facturas` responde
            `409` con `details.reason = NUMERACION_DEL_CLIENTE`. Ausente equivale a `SERVICIO`.
        tipo_transaccion_default:
          type: integer
          enum: [1, 2, 3]
          description: >-
            Ultimo tipo de transaccion (1 Venta de mercaderia, 2 Prestacion de servicios,
            3 Mixto) seleccionado al emitir una factura para este punto operativo. Se usa
            como valor inicial del selector en la pantalla de factura; default 2.
          example: 2
        fiscal_envio_modo:
          $ref: "#/components/schemas/FiscalEnvioModo"
        batch_enabled:
          type: boolean
          nullable: true
          description: Indica si el backend fiscal tiene configuracion batch efectiva para el emisor/facturador.

    OperationalDisplay:
      type: object
      required: [titulo_operativo]
      properties:
        titulo_operativo:
          type: string
          description: "Titulo UX derivado por actividad economica/perfil del usuario. Fallback: alias actividad/perfil, nombre fantasia, alias actividad, descripcion actividad, razon social."

    ReadinessResponse:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [code, ok, message]
            properties:
              code:
                type: string
                example: fiscal_backend_ready
              ok:
                type: boolean
              message:
                type: string

    ClienteSearchResult:
      type: object
      required: [source, documento, razon_social, naturaleza]
      properties:
        source:
          type: string
          enum: [AGENDA_FACTURADOR, IDENTIDAD_COMPARTIDA]
        cliente_id:
          type: string
          nullable: true
        documento_tipo:
          $ref: "#/components/schemas/DocumentoIdentidadTipo"
        documento:
          type: string
        razon_social:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        naturaleza:
          $ref: "#/components/schemas/ClienteNaturaleza"

    ClienteUpsertRequest:
      type: object
      required: [documento_tipo, documento, razon_social]
      properties:
        documento_tipo:
          $ref: "#/components/schemas/DocumentoIdentidadTipo"
        documento:
          type: string
        razon_social:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        naturaleza:
          $ref: "#/components/schemas/ClienteNaturaleza"
          description: Opcional; si se omite, el sistema asume `FISICA`.

    ClienteResponse:
      allOf:
        - $ref: "#/components/schemas/ClienteSearchResult"
        - type: object
          required: [cliente_id]
          properties:
            cliente_id:
              type: string
            activo:
              type: boolean

    ClienteListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClienteResponse"
        total:
          type: integer

    DnitAutocompleteResponse:
      type: object
      required: [found, ambiguous]
      properties:
        found:
          type: boolean
        ambiguous:
          type: boolean
        message:
          type: string
          nullable: true
        cliente:
          $ref: "#/components/schemas/DnitClienteData"
          nullable: true

    DnitClienteData:
      type: object
      required: [documento_tipo, documento, razon_social, naturaleza_sugerida]
      properties:
        documento_tipo:
          type: string
          enum: [RUC, CI]
        documento:
          type: string
        razon_social:
          type: string
        nombre:
          type: string
          nullable: true
        apellido:
          type: string
          nullable: true
        codigo_dnit:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
        naturaleza_sugerida:
          $ref: "#/components/schemas/ClienteNaturaleza"
          description: >-
            Sugerencia no vinculante calculada por el backend (longitud de RUC y/o sufijo
            societario en razon_social). El operador debe confirmarla o editarla, nunca se
            guarda automaticamente.

    DocumentoIdentidadTipo:
      type: string
      enum: [RUC, CI, PASAPORTE, CEDULA_EXTRANJERA, NO_ESPECIFICADO]

    ClienteNaturaleza:
      type: string
      enum: [FISICA, JURIDICA]
      description: >-
        Tipo de persona del receptor. Determina `iTiContRec` en el XML fiscal cuando
        `documento_tipo` es `RUC`; sin efecto para otros tipos de documento. Default `FISICA`.

    CatalogoItem:
      type: object
      required: [id, codigo, descripcion, precio_unitario, iva_tipo, activo]
      properties:
        id:
          type: string
        codigo:
          type: string
        descripcion:
          type: string
        precio_unitario:
          type: integer
          minimum: 0
          description: Precio con IVA incluido en PYG.
        iva_tipo:
          $ref: "#/components/schemas/IvaTipo"
        activo:
          type: boolean

    CatalogoItemUpsertRequest:
      type: object
      required: [descripcion, precio_unitario]
      properties:
        codigo:
          type: string
          nullable: true
          description: Si se omite, el sistema genera uno.
        descripcion:
          type: string
        precio_unitario:
          type: integer
          minimum: 0
        iva_tipo:
          $ref: "#/components/schemas/IvaTipo"
        activo:
          type: boolean
          default: true

    CatalogoItemListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogoItem"
        total:
          type: integer

    IvaTipo:
      type: string
      enum: [IVA_10, IVA_5, EXENTA]

    CondicionVenta:
      type: string
      enum: [CONTADO, CREDITO]

    TipoTransaccionServicio:
      type: integer
      enum: [1, 2, 3]
      default: 2
      description: |
        Criterio fiscal para clasificacion de transaccion en FE:
        - `1`: Venta de mercaderia
        - `2`: Prestacion de servicios
        - `3`: Mixto (mercaderia + servicios)

    DocumentoTipo:
      type: string
      enum: [FACTURA, NOTA_CREDITO, NOTA_REMISION]
      description: '`NOTA_REMISION` llega por la carga masiva (SPEC_DOCUMENTOS_ESCRITORIO_v0.1, fase B1): sin montos ni condicion de venta.'

    DocumentoTipoOperativo:
      type: string
      enum: [CONTADO, CREDITO, NOTA_CREDITO]

    DocumentoEstado:
      type: string
      enum: [EMITIENDO, EMITIDA, PENDIENTE_SIFEN, RECHAZADA, ERROR_OPERATIVO, ERROR_TEMPORAL, ANULADA]

    FiscalEnvioModo:
      type: string
      description: |
        Modo solicitado por el SaaS al backend `facturacion-electronica`.
        `BATCH` es el default operativo de facturadores; `SYNC` queda para smoke opt-in/desarrollo.
      enum: [BATCH, SYNC]

    FiscalDeliveryMode:
      type: string
      description: |
        Modo de despacho efectivo retornado por `facturacion-electronica` para el documento emitido.
        `AUTO_FALLBACK_BATCH` indica que FE recibio solicitud con auto/fallback y despacho final por lote.
        `SYNC_FALLBACK_BATCH` indica que se pidio `SYNC`/`AUTO` explicito para una Nota de Credito
        y SIFEN lo rechazo (codigo 1264), por lo que FE reintenta y despacha por lote.
      enum: [SYNC, BATCH, AUTO_FALLBACK_BATCH, SYNC_FALLBACK_BATCH]

    FacturaPreviewRequest:
      type: object
      required: [condicion_venta, tipo_transaccion, cliente, items]
      properties:
        moneda:
          type: string
          enum: [PYG, USD, EUR, BRL]
          default: PYG
          description: 'SPEC_MONEDA_EXTRANJERA_v0.1. Fuera de PYG los precios admiten hasta 2 decimales; en PYG son enteros.'
        tipo_cambio:
          type: number
          nullable: true
          description: 'Cotizacion a guaranies de toda la factura, hasta 4 decimales. Obligatoria fuera de PYG.'
        condicion_venta:
          $ref: "#/components/schemas/CondicionVenta"
        tipo_transaccion:
          $ref: "#/components/schemas/TipoTransaccionServicio"
        credito_plazo_dias:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
          description: Plazo de credito seleccionado para esta emision cuando `condicion_venta` es `CREDITO`.
        cliente:
          $ref: "#/components/schemas/FacturaClienteInput"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FacturaItemInput"

    FacturaEmitRequest:
      allOf:
        - $ref: "#/components/schemas/FacturaPreviewRequest"
        - type: object
          properties:
            requested_at:
              type: string
              format: date-time
            corrige_documento_id:
              type: string
              format: uuid
              nullable: true
              description: |
                Factura que esta emision corrige (SPEC_CORRECCION_INUTILIZACION_RECHAZADAS_v0.1, RN-A1).
                Debe ser una factura del mismo facturador en `RECHAZADA` o `ERROR_OPERATIVO`, sin
                correccion previa; si no, `409` con `details.reason` `CORRECCION_NO_ADMITIDA` o
                `CORRECCION_EXISTENTE` y no se crea nada.

    FacturaClienteInput:
      type: object
      required: [documento_tipo, documento, razon_social]
      properties:
        cliente_id:
          type: string
          nullable: true
        documento_tipo:
          $ref: "#/components/schemas/DocumentoIdentidadTipo"
        documento:
          type: string
        razon_social:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        naturaleza:
          $ref: "#/components/schemas/ClienteNaturaleza"
          nullable: true

    FacturaItemInput:
      type: object
      required: [cantidad, descripcion, precio_unitario]
      properties:
        catalogo_item_id:
          type: string
          nullable: true
        codigo:
          type: string
          nullable: true
        descripcion:
          type: string
        cantidad:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.0001
          description: Mayor que cero con hasta 4 decimales (MT150 E711; SPEC_MONEDA_EXTRANJERA_v0.1 RN-06).
        precio_unitario:
          type: number
          minimum: 0
          description: Entero en `PYG`; hasta 2 decimales en otra moneda (RN-02).
        iva_tipo:
          $ref: "#/components/schemas/IvaTipo"

    FacturaPreviewResponse:
      type: object
      required: [items, totals]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentoItemSnapshot"
        totals:
          $ref: "#/components/schemas/DocumentoTotals"

    DocumentoItemSnapshot:
      type: object
      required: [line_no, codigo, descripcion, cantidad, precio_unitario, iva_tipo, subtotal, base_imponible, iva_monto]
      properties:
        line_no:
          type: integer
        catalogo_item_id:
          type: string
          nullable: true
        codigo:
          type: string
          nullable: true
        descripcion:
          type: string
        cantidad:
          type: number
          description: Hasta 4 decimales.
        precio_unitario:
          type: number
          description: Entero en `PYG`; 2 decimales en otra moneda.
        iva_tipo:
          $ref: "#/components/schemas/IvaTipo"
        subtotal:
          type: number
        base_imponible:
          type: number
          description: Redondeado por linea.
        iva_monto:
          type: number
          description: Redondeado por linea.

    DocumentoTotals:
      type: object
      required: [subtotal, total_sin_iva, iva_5, iva_10, total_iva, total]
      properties:
        subtotal:
          type: number
        total_sin_iva:
          type: number
        iva_5:
          type: number
        iva_10:
          type: number
        total_iva:
          type: number
        total:
          type: number
        descuento:
          type: integer
          description: 'Solo en facturas de carga con los totales del backend fiscal (SPEC_TOTALES_FE_EN_CARGA_v0.1). Descuentos por articulo y global.'
        nota_credito_por_referencia:
          type: boolean
          description: 'Factura de carga con descuentos, anticipos o IVA exonerado: su nota de credito total se emite por referencia en el backend fiscal, sin lineas.'
        anticipo:
          type: integer
          description: 'Anticipo aplicado. Con anticipo no se admite la nota de credito total desde FS (`409` con `reason: NOTA_CREDITO_CON_ANTICIPO`). Una factura en moneda extranjera tampoco (`409` con `reason: NOTA_CREDITO_MONEDA_EXTRANJERA`).'
        fuente:
          type: string
          enum: [FS, FE]
          description: "`FE`: totales oficiales de `GET /v1/documentos/{uuid}/totales` del documento aprobado (SPEC_MONEDA_EXTRANJERA_v0.1 A-2). Ausente o `FS`: calculo de la vista previa. Montos enteros en `PYG` y con 2 decimales en otra moneda."
        total_guaranies:
          type: integer
          description: dTotalGs de FE (total por tipo de cambio, redondeado). Solo con `fuente` FE.
        redondeo:
          type: number
          description: dRedon de FE. Solo con `fuente` FE.

    DocumentoVinculo:
      type: object
      required: [id, estado]
      properties:
        id: { type: string, format: uuid }
        numero_fiscal: { type: string, nullable: true }
        estado:
          $ref: "#/components/schemas/DocumentoEstado"
    DocumentoResponse:
      type: object
      required: [id, tipo, estado, condicion_venta, cliente, items, totals, delivery]
      properties:
        carga:
          type: object
          nullable: true
          description: La factura vino de una carga masiva.
          properties:
            id: { type: string, format: uuid }
            numero_archivo: { type: string, nullable: true }
        id:
          type: string
        tipo:
          $ref: "#/components/schemas/DocumentoTipo"
        estado:
          $ref: "#/components/schemas/DocumentoEstado"
        condicion_venta:
          allOf:
            - $ref: "#/components/schemas/CondicionVenta"
          nullable: true
          description: Null en una nota de remision.
        moneda:
          type: string
          description: 'Moneda de todos los montos del documento (ISO 4217); PYG por omision.'
        tipo_cambio:
          type: number
          nullable: true
        remision:
          type: object
          nullable: true
          description: 'Solo en una nota de remision: resumen del detalle del backend fiscal.'
          properties:
            motivo: { type: integer, nullable: true }
            motivo_descripcion: { type: string, nullable: true }
            inicio_traslado: { type: string, nullable: true }
            fin_traslado: { type: string, nullable: true }
            kilometros: { type: number, nullable: true }
            transportista: { type: string, nullable: true }
            vehiculo: { type: string, nullable: true }
        numero_fiscal:
          type: string
          nullable: true
          example: 001-001-0000123
        cdc:
          type: string
          nullable: true
        fiscal_document_id:
          type: string
          nullable: true
        external_ref:
          type: string
          nullable: true
        corrige_a:
          allOf:
            - $ref: "#/components/schemas/DocumentoVinculo"
          nullable: true
          description: Factura que esta corrige (SPEC_CORRECCION_INUTILIZACION_RECHAZADAS_v0.1, RN-A4).
        corregida_por:
          allOf:
            - $ref: "#/components/schemas/DocumentoVinculo"
          nullable: true
          description: Correccion de esta factura (RN-A4).
        inutilizacion:
          type: object
          nullable: true
          description: Ultimo intento de inutilizar el numero desde FS (RN-B4).
          required: [status, intentos]
          properties:
            status: { type: string, enum: [ACCEPTED, REJECTED, FAILED] }
            evento_id: { type: string, nullable: true }
            motivo: { type: string, nullable: true }
            rejection_code: { type: string, nullable: true }
            rejection_message: { type: string, nullable: true }
            intentos: { type: integer, minimum: 0 }
            last_at: { type: string, format: date-time, nullable: true }
        puede_inutilizar:
          type: boolean
          description: |
            `true` para una `FACTURA` en `RECHAZADA` con CDC y numero, sin inutilizacion aceptada (RN-B1).
            Cuando es `true`, `accion_detalle.acciones_sugeridas` incluye `INUTILIZAR_NUMERO`.
        puede_reintentar_emision:
          type: boolean
          description: |
            `true` solo si `facturacion-electronica` nunca recibio el documento: estado
            `ERROR_TEMPORAL` o `PENDIENTE_SIFEN`, sin `document_uuid` ni `cdc`, y con el fallo del
            ultimo intento registrado. Es la unica condicion para mostrar "Reintentar emision"
            (SPEC_REINTENTO_EMISION_CONFIRMADO_v0.1, RN-01). Ser candidato no garantiza el
            reintento: el servidor confirma con FE antes de reencolar.
        fiscal_envio_modo:
          $ref: "#/components/schemas/FiscalEnvioModo"
        delivery_mode:
          allOf:
            - $ref: "#/components/schemas/FiscalDeliveryMode"
          nullable: true
        fiscal_idempotent:
          type: boolean
          nullable: true
          description: Indica si FE reporto respuesta idempotente reutilizando un documento fiscal existente.
        batch:
          $ref: "#/components/schemas/BatchTransmissionSummary"
        cliente:
          $ref: "#/components/schemas/FacturaClienteInput"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentoItemSnapshot"
        totals:
          $ref: "#/components/schemas/DocumentoTotals"
        fiscal_status:
          type: object
          nullable: true
          additionalProperties: true
        documento_relacionado_id:
          type: string
          nullable: true
          description: ID de la factura original cuando el documento es una Nota de Credito.
        nce_motivo:
          type: string
          nullable: true
        emitido_por:
          $ref: "#/components/schemas/DocumentoEmisor"
        delivery:
          $ref: "#/components/schemas/DeliverySummary"
        created_at:
          type: string
          format: date-time
          nullable: true

    CargaMasivaEstado:
      type: string
      enum: [RECIBIDA, VALIDANDO, RECHAZADA, VALIDADA, EN_COLA, EN_PREPARACION, EN_SIFEN, FINALIZADA, CANCELADA]
    CargaMasivaProblema:
      type: object
